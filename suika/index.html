<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>7分さんのスイカゲーム</title>
<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{ margin:0; padding:0;}
body{
font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
background:linear-gradient(180deg,#2b1055 0%,#7597de 130%);
background-color:#2b1055; color:#fff; min-height:100vh; padding:10px 8px 28px;
user-select:none; -webkit-user-select:none;
}
h1{ font-size:19px; text-align:center; margin:4px 0 2px;}
.sub{ text-align:center; font-size:11.5px; color:#d9d2f5; margin:0 0 8px;}
#hud{
display:flex; justify-content:space-between; align-items:center; gap:8px;
max-width:380px; margin:0 auto 8px; background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:7px 12px; font-size:14px;
}
#hud b{ font-variant-numeric:tabular-nums;}
#next-box{ display:flex; align-items:center; gap:6px; font-size:12px; color:#d9d2f5;}
#next-img{ width:34px; height:34px; border-radius:50%; object-fit:cover; border:2px solid #fff; background:#888;}
#stage{ width:min(94vw, 380px, (100dvh - 245px) * 0.7826); margin:0 auto;}
canvas{
display:block; width:100%; height:auto; border-radius:14px; touch-action:none;
background:linear-gradient(180deg,#fdf6e3 0%,#f7e8c9 100%);
box-shadow:0 10px 24px rgba(0,0,0,.35);
}
#evo{
max-width:380px; margin:10px auto 0; background:rgba(255,255,255,.1);
border-radius:12px; padding:8px 10px;
}
#evo.cap{ font-size:11.5px; color:#d9d2f5; margin-bottom:6px; text-align:center;}
#evo.row{ display:flex; align-items:flex-end; justify-content:center; gap:5px;}
#evo img{ border-radius:50%; object-fit:cover; background:#888;}
#evo.arr{ color:#d9d2f5; font-size:11px; padding-bottom:4px;}
.note{ max-width:380px; margin:10px auto 0; font-size:11.5px; color:#cfc6ee; line-height:1.7;}
#over-overlay{
display:none; position:fixed; inset:0; background:rgba(10,4,30,.78);
align-items:center; justify-content:center; z-index:50; padding:16px;
}
#over-card{
background:#fdfaf0; color:#33255e; border-radius:16px; padding:22px 20px;
max-width:320px; width:100%; text-align:center; box-shadow:0 12px 30px rgba(0,0,0,.5);
}
#over-card h2{ margin:0 0 6px; font-size:21px;}
#over-card p{ margin:4px 0; font-size:14px;}
#over-card.best{ color:#b8860b; font-weight:700;}
#over-card button{
font:inherit; font-size:15px; border:none; border-radius:999px; padding:10px 22px;
background:#ff4fc3; color:#fff; font-weight:700; cursor:pointer; margin-top:12px;
}
</style>
</head>
<body>
<h1>🍉 7分さんのスイカゲーム</h1>
<p class="sub">同じ顔をくっつけると、ひとまわり大きくなるよ</p>
<div id="hud">
<span>スコア <b id="hud-score">0</b></span>
<span style="font-size:12px;color:#d9d2f5">ベスト <b id="hud-best">0</b></span>
<span id="next-box">つぎ <img id="next-img" alt="つぎ"></span>
</div>
<div id="stage"><canvas id="cv" width="360" height="540"></canvas></div>
<div id="evo">
<div class="cap">大きくなる順番（最後が一番大きいよ）</div>
<div class="row" id="evo-row"></div>
</div>
<p class="note">箱の中をタップ（またはドラッグして離す）と、上から顔が落ちるよ。同じ顔同士がくっつくと合体して次の大きさに。上の赤い線から長くはみ出すとゲームオーバーだよ。一番大きい顔を2つくっつけると消えてボーナス+100！</p>

<div id="over-overlay">
<div id="over-card">
<h2>ゲームオーバー</h2>
<p id="over-detail"></p>
<p class="best" id="over-best"></p>
<button id="btn-retry" type="button">もう一度遊ぶ</button>
</div>
</div>

const RADII = [15, 21, 28, 37, 47, 59, 73, 90];
const RING = ['#e74c3c','#e67e22','#d4a017','#27ae60','#16a085','#2980b9','#8e44ad','#ff4fc3'];
const POINTS = [1, 3, 6, 10, 15, 21, 28]; /* stage s 同士の合体で得点 */
const W = 360, H = 460, WALL = 10, FLOOR = H - 10, LINE_Y = 100, DROP_Y = 48;
const BEST_KEY = 'nanahun-suika-best-v1';

let bodies = [], score = 0, best = 0, over = false;

function randStage(){ return (Math.random() * 4) | 0;} /* 落とすのは小さい4種 */
function addBody(stage, x, y, vx, vy){
const b = { id:idSeq++, stage, r:RADII[stage], x, y, vx:vx||0, vy:vy||0, born:simTime, overTime:0};
bodies.push(b); return b;
}
function reset(){
bodies = []; score = 0; over = false; popups = [];
cur = randStage(); next = randStage(); cooldownUntil = 0;
document.getElementById('over-overlay').style.display = 'none';
syncHud();
}
function syncHud(){
if (score > best){ best = score; try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch(e) {} }
document.getElementById('hud-score').textContent = score;
document.getElementById('hud-best').textContent = best;
document.getElementById('next-img').src = IMAGES[next];
}
function drop(){
if (over || simTime < cooldownUntil) return;
const r = RADII[cur];
const x = Math.min(Math.max(aimX, WALL + r), W - WALL - r);
addBody(cur, x, DROP_Y, 0, 0);
cur = next; next = randStage();
cooldownUntil = simTime + 0.55;
syncHud();
}

/* ===== 物理（円同士の衝突＋合体） ===== */
function physics(dt){
const G = 2000;
for (const b of bodies){
b.vy += G * dt;
if (b.vy > 950) b.vy = 950;
b.x += b.vx * dt; b.y += b.vy * dt;
}
for (const b of bodies){
if (b.x - b.r < WALL){ b.x = WALL + b.r; b.vx = Math.abs(b.vx) * 0.25;}
if (b.x + b.r > W - WALL){ b.x = W - WALL - b.r; b.vx = -Math.abs(b.vx) * 0.25;}
if (b.y + b.r > FLOOR){
b.y = FLOOR - b.r;
if (b.vy > 0) b.vy = 0;
b.vx *= 0.9; if (Math.abs(b.vx) < 3) b.vx = 0;
}
if (b.y - b.r < 26){ b.y = 26 + b.r; if (b.vy < 0) b.vy = 0;} /* 天井の安全弁 */
}
/* 合体候補（このサブステップで最大で重ならないペア群） */
const mergePairs = [];
const used = new Set();
for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++){
const a = bodies[i], b = bodies[j];
if (a.stage!== b.stage || used.has(a.id) || used.has(b.id)) continue;
const dx = b.x - a.x, dy = b.y - a.y, min = a.r + b.r;
if (dx*dx + dy*dy < min*min*0.92){
mergePairs.push([a, b]); used.add(a.id); used.add(b.id);
}
}
/* 押し出し（位置補正） */
for (let iter = 0; iter < 3; iter++){
for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++){
const a = bodies[i], b = bodies[j];
let dx = b.x - a.x, dy = b.y - a.y;
let d2 = dx*dx + dy*dy; const min = a.r + b.r;
if (d2 >= min*min || d2 === 0) continue;
const d = Math.sqrt(d2), overlap = (min - d) / 2;
dx /= d; dy /= d;
const ma = a.r*a.r, mb = b.r*b.r, mt = ma + mb;
a.x -= dx * overlap * 2 * (mb/mt); a.y -= dy * overlap * 2 * (mb/mt);
b.x += dx * overlap * 2 * (ma/mt); b.y += dy * overlap * 2 * (ma/mt);
/* 接近方向の速度を均す（跳ね返りほぼなし） */
const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
const rel = rvx*dx + rvy*dy;
if (rel < 0){
const imp = -rel * 0.5;
a.vx -= dx * imp * (mb/mt) * 2 * 0.5; a.vy -= dy * imp * (mb/mt) * 2 * 0.5;
b.vx += dx * imp * (ma/mt) * 2 * 0.5; b.vy += dy * imp * (ma/mt) * 2 * 0.5;
}
}
for (const b of bodies){
if (b.x - b.r < WALL) b.x = WALL + b.r;
if (b.x + b.r > W - WALL) b.x = W - WALL - b.r;
if (b.y + b.r > FLOOR) b.y = FLOOR - b.r;
}
}
/* 合体の実行 */
for (const [a, b] of mergePairs){
if (!bodies.includes(a) ||!bodies.includes(b)) continue;
const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
bodies = bodies.filter(t => t!== a && t!== b);
if (a.stage >= 7){
score += 100;
popups.push({ x:mx, y:my, text:'+100', until:simTime + 0.9});
} else {
const nb = addBody(a.stage + 1, mx, my, (a.vx + b.vx) / 2, (a.vy + b.vy) / 2);
nb.born = simTime - 0.35; /* 生まれたての猶予を少し短く */
score += POINTS[a.stage];
popups.push({ x:mx, y:my, text:'+' + POINTS[a.stage], until:simTime + 0.7});
}
syncHud();
}
/* ゲームオーバー判定：線より上が長く続いたら */
if (!over){
for (const b of bodies){
if (simTime - b.born > 1.1 && b.y - b.r < LINE_Y){
b.overTime += dt;
if (b.overTime > 1.6){ gameOver(); break;}
} else {
b.overTime = Math.max(0, b.overTime - dt * 2);
}
}
}
}
function step(dt){
let remain = Math.min(dt, 0.05);
const sub = 1 / 240;
while (remain > 0){
const d = Math.min(sub, remain);
simTime += d;
if (!over) physics(d);
remain -= d;
}
popups = popups.filter(p => p.until > simTime);
}
function gameOver(){
over = true;
let msg = '';
if (score > best){
best = score;
try { localStorage.setItem(BEST_KEY, JSON.stringify(best));} catch(e) {}
msg = '🏆 ベスト記録更新！';
} else {
msg = 'ベスト：' + best;
}
document.getElementById('over-detail').textContent = 'スコア ' + score;
document.getElementById('over-best').textContent = msg;
document.getElementById('over-overlay').style.display = 'flex';
syncHud();
}

/* ===== 描画 ===== */
function drawFace(x, y, r, stage, alpha){
if (!ctx) return;
const img = imgEls[stage];
ctx.save();
ctx.globalAlpha = alpha == null? 1: alpha;
ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
if (img.complete && img.naturalWidth){
ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
} else {
ctx.fillStyle = RING[stage]; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
ctx.restore();
ctx.save();
ctx.globalAlpha = alpha == null? 1: alpha;
ctx.beginPath(); ctx.arc(x, y, r - 1.5, 0, Math.PI * 2);
ctx.lineWidth = 3; ctx.strokeStyle = RING[stage]; ctx.stroke();
ctx.restore();
}
function render(){
if (!ctx) return;
ctx.clearRect(0, 0, W, H);
/* 箱 */
ctx.strokeStyle = '#b09a6a'; ctx.lineWidth = 4;
ctx.beginPath();
ctx.moveTo(WALL - 3, 30); ctx.lineTo(WALL - 3, FLOOR + 3); ctx.lineTo(W - WALL + 3, FLOOR + 3); ctx.lineTo(W - WALL + 3, 30);
ctx.stroke();
/* ゲームオーバーライン */
const danger = bodies.some(b => b.y - b.r < LINE_Y);
ctx.save();
ctx.strokeStyle = danger? '#ff3b30': 'rgba(255,59,48,.45)';
ctx.lineWidth = 2; ctx.setLineDash([7, 6]);
ctx.beginPath(); ctx.moveTo(WALL, LINE_Y); ctx.lineTo(W - WALL, LINE_Y); ctx.stroke();
ctx.restore();
/* 落下ガイド＋現在の顔 */
if (!over && simTime >= cooldownUntil){
const r = RADII[cur];
const x = Math.min(Math.max(aimX, WALL + r), W - WALL - r);
ctx.save();
ctx.strokeStyle = 'rgba(90,70,30,.3)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.moveTo(x, DROP_Y + r + 2); ctx.lineTo(x, FLOOR); ctx.stroke();
ctx.restore();
drawFace(x, DROP_Y, r, cur, 0.9);
}
for (const b of bodies) drawFace(b.x, b.y, b.r, b.stage, 1);
/* スコアポップ */
ctx.save();
ctx.font = '700 17px sans-serif'; ctx.textAlign = 'center';
for (const p of popups){
const k = Math.max(0, (p.until - simTime) / 0.8);
ctx.globalAlpha = Math.min(1, k + 0.25);
ctx.fillStyle = '#e8590c';
ctx.fillText(p.text, p.x, p.y - (0.9 - k) * 26);
}
ctx.restore();
}
function loop(ts){
if (lastTs == null) lastTs = ts;
step(Math.min((ts - lastTs) / 1000, 0.05));
lastTs = ts;
render();
rafId = requestAnimationFrame(loop);
}

/* ===== 入力 ===== */
function canvasX(clientX){
const rect = cv.getBoundingClientRect();
return (clientX - rect.left) * (W / rect.width);
}
cv.addEventListener('pointermove', e => { aimX = canvasX(e.clientX);});
cv.addEventListener('pointerdown', e => { aimX = canvasX(e.clientX); try { cv.setPointerCapture(e.pointerId);} catch(err) {}});
cv.addEventListener('pointerup', e => { aimX = canvasX(e.clientX); drop();});
document.getElementById('btn-retry').addEventListener('click', reset);

/* 進化表 */
(function(){
const row = document.getElementById('evo-row');
IMAGES.forEach((src, i) => {
if (i > 0){
const s = document.createElement('span'); s.className = 'arr'; s.textContent = '›'; row.appendChild(s);
}
const im = document.createElement('img');
im.src = src; im.alt = 'stage' + (i + 1);
const px = 13 + i * 4.4;
im.style.width = px + 'px'; im.style.height = px + 'px';
im.style.border = '2px solid ' + RING[i];
row.appendChild(im);
});
})();

/* 高解像度対応 */
(function(){
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr;
if (ctx) ctx.scale(dpr, dpr);
cv.style.aspectRatio = W + ' / ' + H;
})();

reset();
rafId = requestAnimationFrame(loop);

/* テスト用フック */
window.SUIKA = {
get bodies(){ return bodies;},
get score(){ return score;},
get over(){ return over;},
get cur(){ return cur;},
addBody, drop, step, reset,
setAim(x){ aimX = x;},
RADII, W, H, WALL, FLOOR, LINE_Y,
stop(){ if (rafId) cancelAnimationFrame(rafId);},
};
</script>
</body>

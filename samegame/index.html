<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>さめがめ ～顔で見る7分さん～</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#2b6a52,#1e4d3a); color:#fff;
    min-height:100dvh; padding:14px 10px 22px; user-select:none; -webkit-user-select:none;
  }
  .wrap{ max-width:480px; margin:0 auto; text-align:center; }
  h1{ font-size:23px; letter-spacing:.06em; }
  h1 .sub{ font-size:12.5px; font-weight:400; opacity:.85; margin-left:6px; }
  .brand-logo{height:28px;width:auto;vertical-align:middle;pointer-events:none;margin-left:6px}
  .hud{ display:flex; justify-content:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:4px 13px; font-size:13px; }
  .chip b{ font-size:15px; }
  .chipbtn{ font:inherit; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:4px 11px; font-size:13px; color:#fff; cursor:pointer; box-shadow:none; }
  .chipbtn:active{ transform:scale(.94); }
  #msg{ margin-top:9px; font-size:13px; min-height:20px; line-height:1.5; color:#ffe9a8; }
  #board{
    width:min(94vw, calc((100dvh - 240px) * 0.7692), 440px);
    margin:10px auto 0; display:grid; grid-template-columns:repeat(10, 1fr); gap:3px;
  }
  .cell{ aspect-ratio:1; border-radius:7px; overflow:hidden; position:relative; background:rgba(255,255,255,.10); }
  .cell.empty{ background:transparent; }
  .cell img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .cell.sel{ outline:3px solid #ffd94d; outline-offset:-3px; filter:brightness(1.2); animation:pulse .45s infinite alternate; z-index:1; }
  @keyframes pulse{ from{ transform:scale(1); } to{ transform:scale(1.07); } }
  .btns{ display:flex; justify-content:center; gap:10px; margin-top:16px; }
  button{
    font:inherit; font-size:14.5px; font-weight:700; color:#20402f;
    background:#ffd94d; border:none; border-radius:999px; padding:10px 20px; cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  button.sub{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); box-shadow:none; }
  button:active{ transform:scale(.96); }
  #result{ position:fixed; inset:0; background:rgba(10,25,18,.72); display:flex; align-items:center; justify-content:center; z-index:10; padding:20px; }
  #result.hidden{ display:none; }
  .card{ background:#fff; color:#2b2620; border-radius:20px; padding:26px 30px; text-align:center; max-width:320px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .card h2{ font-size:21px; margin-bottom:8px; }
  .card p{ font-size:14px; line-height:1.7; }
  .card .big{ font-size:30px; font-weight:800; color:#b3543f; }
  .card button{ margin-top:14px; }
  footer{ margin-top:16px; font-size:11px; opacity:.65; }
</style>
</head>

let grid = [], score = 0, sel = null, selKey = '', over = false, history = [];
let best = +(localStorage.getItem('nanahun-same-best-v1') || 0);
const $ = id => document.getElementById(id);

/* ---- sound: Web Audio synthesized effects, no audio files ---- */
const SND_KEY = 'nanahun-snd-samegame';
let sndMuted = false;
try { sndMuted = localStorage.getItem(SND_KEY) === '1'; } catch (e) { sndMuted = false; }
let actx = null;
function audio(){
  if (sndMuted) return null;
  try {
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, dur, opts){
  const ac = audio();
  if (!ac) return;
  opts = opts || {};
  const t0 = ac.currentTime + (opts.delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = opts.type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (opts.slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, opts.slideTo), t0 + dur);
  const v = opts.vol || 0.08;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfxSelect(){ tone(660, 0.07, {type: 'triangle', vol: 0.06}); }
function sfxRemove(n){
  const base = 420 + Math.min(n, 20) * 22;
  const notes = n >= 8 ? 3 : 2;
  for (let i = 0; i < notes; i++) tone(base * Math.pow(1.335, i), 0.1, {type: 'triangle', vol: 0.085, delay: i * 0.055});
  tone(base * 2, 0.16, {type: 'sine', vol: 0.05, delay: notes * 0.055});
}
function sfxBad(){ tone(150, 0.13, {type: 'square', vol: 0.045, slideTo: 110}); }
function sfxUndo(){ tone(620, 0.11, {type: 'triangle', vol: 0.06, slideTo: 330}); }
function sfxEnd(allClear){
  const seq = allClear ? [523, 659, 784, 1047] : [523, 659, 784];
  seq.forEach((f, i) => tone(f, 0.16, {type: 'triangle', vol: 0.08, delay: i * 0.09}));
}
function soundMuted(){ return sndMuted; }
function updateSndBtn(){ const b = $('snd'); if (b) b.textContent = sndMuted ? '🔇' : '🔊'; }
function toggleSound(){
  sndMuted = !sndMuted;
  try { localStorage.setItem(SND_KEY, sndMuted ? '1' : '0'); } catch (e) {}
  updateSndBtn();
  if (!sndMuted) sfxSelect();
  return sndMuted;
}
document.addEventListener('pointerdown', () => { audio(); }, {passive: true});

function newGame(){
  grid = Array.from({length: ROWS}, () => Array.from({length: COLS}, () => Math.floor(Math.random() * NT)));
  score = 0; sel = null; selKey = ''; over = false; history = [];
  $('result').classList.add('hidden');
  render();
  msg('同じ顔が2つ以上くっついてたら、タップで選んでもう一度タップで消せるよ');
}
function groupAt(r, c){
  const t = grid[r][c];
  if (t === null || t === undefined) return [];
  const seen = new Set([r + ',' + c]);
  const st = [[r, c]], out = [];
  while (st.length){
    const [y, x] = st.pop();
    out.push([y, x]);
    for (const [dy, dx] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ny = y + dy, nx = x + dx;
      if (ny < 0 || nx < 0 || ny >= ROWS || nx >= COLS) continue;
      const k = ny + ',' + nx;
      if (seen.has(k) || grid[ny][nx] !== t) continue;
      seen.add(k); st.push([ny, nx]);
    }
  }
  return out;
}
function keyOf(g){ return g.map(p => p[0] + ',' + p[1]).sort().join('|'); }
function tap(r, c){
  if (over) return;
  const g = groupAt(r, c);
  if (g.length < 2){
    sel = null; selKey = ''; render();
    if (grid[r][c] !== null){ sfxBad(); msg('1つだけじゃ消せないよ。2つ以上くっついてる顔を選んでね'); }
    return;
  }
  const k = keyOf(g);
  if (sel && k === selKey) removeSel(g);
  else {
    sel = g; selKey = k; render();
    sfxSelect();
    msg(g.length + '個選択中…もう一度タップで消すと ' + (g.length * (g.length - 1)) + '点！');
  }
}
function removeSel(g){
  history.push(JSON.stringify({grid: grid, score: score}));
  sfxRemove(g.length);
  score += g.length * (g.length - 1);
  for (const [r, c] of g) grid[r][c] = null;
  for (let c = 0; c < COLS; c++){
    const stack = [];
    for (let r = ROWS - 1; r >= 0; r--) if (grid[r][c] !== null) stack.push(grid[r][c]);
    for (let r = ROWS - 1, i = 0; r >= 0; r--, i++) grid[r][c] = i < stack.length ? stack[i] : null;
  }
  const cols = [];
  for (let c = 0; c < COLS; c++) if (grid.some(row => row[c] !== null)) cols.push(c);
  const ng = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  cols.forEach((oc, nc) => { for (let r = 0; r < ROWS; r++) ng[r][nc] = grid[r][oc]; });
  grid = ng; sel = null; selKey = '';
  if (!hasMoves()){
    over = true;
    const left = countLeft();
    let bonus = 0;
    if (left === 0){ bonus = 1000; score += 1000; }
    if (score > best){ best = score; localStorage.setItem('nanahun-same-best-v1', String(best)); }
    render();
    showResult(left, bonus);
    sfxEnd(left === 0);
  } else render();
}
function countLeft(){ let n = 0; for (const row of grid) for (const v of row) if (v !== null) n++; return n; }
function hasMoves(){
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const v = grid[r][c];
    if (v === null) continue;
    if (r + 1 < ROWS && grid[r + 1][c] === v) return true;
    if (c + 1 < COLS && grid[r][c + 1] === v) return true;
  }
  return false;
}
function undo(){
  const h = history.pop();
  if (!h){ msg('これ以上戻れないよ'); return; }
  const s = JSON.parse(h);
  grid = s.grid; score = s.score; sel = null; selKey = ''; over = false;
  $('result').classList.add('hidden');
  render();
  sfxUndo();
  msg('1手戻したよ');
}
function render(){
  const b = $('board');
  b.innerHTML = '';
  const selSet = new Set(sel ? sel.map(p => p[0] + ',' + p[1]) : []);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    const d = document.createElement('div');
    const v = grid[r][c];
    if (v === null){ d.className = 'cell empty'; }
    else {
      d.className = 'cell' + (selSet.has(r + ',' + c) ? ' sel' : '');
      const img = document.createElement('img');
      img.src = IMGS[v]; img.alt = '';
      d.appendChild(img);
      (function(rr, cc){ d.addEventListener('click', () => tap(rr, cc)); })(r, c);
    }
    b.appendChild(d);
  }
  $('score').textContent = score;
  $('best').textContent = best;
  $('left').textContent = countLeft();
}
function msg(t){ $('msg').textContent = t; }
function showResult(left, bonus){
  $('r-score').textContent = score;
  $('r-left').textContent = left;
  $('r-best').textContent = best;
  $('r-bonus').textContent = bonus ? '全消しボーナス +1000点！' : '';
  $('result').classList.remove('hidden');
}
$('again').addEventListener('click', newGame);
$('restart').addEventListener('click', newGame);
$('undo').addEventListener('click', undo);
$('snd').addEventListener('click', toggleSound);
updateSndBtn();
window.SAME = {
  newGame: newGame, groupAt: groupAt, tap: tap, undo: undo, hasMoves: hasMoves, countLeft: countLeft,
  soundMuted: soundMuted, toggleSound: toggleSound,
  setGrid: function(g, s){ grid = g; score = s || 0; sel = null; selKey = ''; over = false; history = []; $('result').classList.add('hidden'); render(); },
  state: function(){ return { grid: JSON.parse(JSON.stringify(grid)), score: score, over: over, sel: sel ? sel.length : 0 }; }
};

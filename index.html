<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>アプリ置き場 | domuzou.github.io</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --text:#2b2620; --muted:#8a7f70;
    --accent:#b3543f; --border:#e5ddd0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1d1a17; --card:#2a2521; --text:#f0e9df; --muted:#a2937f; --accent:#e08a6d; --border:#3d362e; }
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; padding:32px 16px 48px;
  }
  .wrap{ max-width:520px; margin:0 auto; }
  header{ text-align:center; margin-bottom:28px; }
  header .mark{ font-size:40px; }
  header h1{ font-size:24px; letter-spacing:.08em; margin-top:6px; }
  header p{ color:var(--muted); font-size:13px; margin-top:6px; }
  .apps{ display:flex; flex-direction:column; gap:14px; }
  a.app{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px 18px; text-decoration:none; color:var(--text);
    box-shadow:0 2px 8px rgba(0,0,0,.05);
  }
  a.app:active{ transform:scale(.985); }
  .app .icon{ font-size:34px; flex:none; }
  .app .icon-img{ width:46px; height:46px; border-radius:12px; object-fit:cover; flex:none; }
  .app .name{ font-size:16px; font-weight:700; line-height:1.4; }
  .app .desc{ font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.5; }
  .app .go{ margin-left:auto; color:var(--accent); font-size:20px; flex:none; }
  .ext{ font-size:10.5px; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:1px 5px; margin-left:6px; vertical-align:2px; }
  footer{ text-align:center; color:var(--muted); font-size:11.5px; margin-top:32px; }
</style>
</head>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>世界名画コレクション～パズルで見る7分さん～</title>
<style>
:root{--bg:#171a26;--panel:#232840;--line:#3c4266;--txt:#f2f3fa;--sub:#a7abc4;--accent:#ffb703;--accent2:#4db2ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;padding:12px;max-width:480px;margin:0 auto;user-select:none;-webkit-user-select:none}
header{text-align:center;margin:6px 0 10px;position:relative}
header h1{font-size:21px;margin:0}
header h1 .ver{font-size:11px;color:var(--sub);margin-left:6px}
button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;cursor:pointer}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:#231a00;border-color:var(--accent);font-weight:700}
#stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;color:var(--txt)}
.stage-card:active{transform:scale(.98)}
.stage-card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block}
.stage-card .sname{font-weight:800;font-size:16px;margin-top:6px}
.stage-card .stime{font-size:12px;color:var(--sub)}
.stage-card .stime b{color:var(--accent)}
.stage-card.cleared{border-color:var(--accent)}
#summary{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;line-height:1.7}
#summary b{color:var(--accent)}
#info{display:flex;justify-content:space-between;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
#info b{color:var(--accent)}
#board-wrap{position:relative;width:100%;max-width:440px;margin:0 auto}
#board{position:relative;width:100%;aspect-ratio:3/4;background:#10131f;border:2px solid var(--line);border-radius:12px;overflow:hidden;touch-action:manipulation}
.tile{position:absolute;width:33.3333%;height:25%;background-repeat:no-repeat;border:1px solid rgba(0,0,0,.45);border-radius:4px;transition:transform .16s ease;display:flex;align-items:flex-start;justify-content:flex-start}
.tile .num{font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:0 0 6px 0;padding:1px 6px;display:none}
body.show-num .tile .num{display:block}
#preview{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:12px;display:none;z-index:5}
#clear-panel{position:absolute;inset:0;background:rgba(10,12,20,.9);z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;padding:16px;border-radius:12px}
#clear-panel .big{font-size:23px;font-weight:800;color:var(--accent)}
#clear-panel .time{font-size:32px;font-weight:800}
#clear-panel button{width:82%}
.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.controls button{flex:1;min-width:100px}
.controls label{display:flex;align-items:center;gap:5px;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
#btn-sound{position:absolute;right:0;top:-2px;padding:5px 9px;font-size:15px;line-height:1}
</style>
</head>
<body>
<header><h1 style="font-size:18px">🖼️ 世界名画コレクション<span class="ver">v1.2</span><br><span style="font-size:14px;font-weight:600">～パズルで見る7分さん～</span></h1><button id="btn-sound" aria-label="効果音のオン・オフ">🔊</button></header>

<div id="screen-select">
  <div id="stage-grid"></div>
  <div id="summary"></div>
  <div class="controls">
    <button id="btn-share-all" style="display:none">📤 全面クリア結果を共有／コピー</button>
    <button id="btn-reset-records">🗑️ 記録をリセット</button>
  </div>
  <p class="note">遊び方：面を選んでスタート。どの面からでも始められるよ。タイルをタップすると空きマスの方向へスライドするさ（同じ列・行ならまとめて動く）。各面のベストタイムが記録されて、全ての面をクリアすると合計タイムと平均タイムが出るよ。</p>
</div>

<div id="screen-play" style="display:none">
  <div id="info">
    <span><b id="info-stage">1面</b></span>
    <span>タイム <b id="info-time">0:00.0</b></span>
    <span>手数 <b id="info-moves">0</b></span>
    <span>ベスト <b id="info-best">-</b></span>
  </div>
  <div id="board-wrap">
    <div id="board"></div>
    <div id="preview"></div>
    <div id="clear-panel">
      <div class="big" id="clear-title">🎉 クリア！</div>
      <div class="time" id="clear-time">0:00.0</div>
      <div id="clear-detail"></div>
      <div id="clear-total" style="font-size:13px;line-height:1.7"></div>
      <button class="primary" id="btn-next-stage">▶️ 次の面へ</button>
      <button id="btn-share">📤 結果を共有／コピー</button>
      <button id="btn-again">🔁 もう一度</button>
      <button id="btn-back">🗂️ 面選択に戻る</button>
    </div>
  </div>
  <div class="controls">
    <button id="btn-show-preview">👀 完成図を見る</button>
    <button id="btn-reset">↩️ 最初から</button>
    <button id="btn-back2">🗂️ 面選択</button>
    <label><input type="checkbox" id="chk-num" checked> 数字を表示</label>
  </div>
</div>

const COLS = 3, ROWS = 4, N = COLS * ROWS, BLANK = N - 1;
const REC_KEY = "slide_puzzle_records_v2";
const STAGE_SEEDS = [101, 202, 303, 404, 505, 606, 707, 808]; // 面ごとの基準（毎回ランダムにずらす）

/* ---- 効果音（Web Audioで合成・ファイルなし） ---- */
const SND_KEY = "nanahun-snd-puzzle";
let actx = null;
let sndMuted = false;
try{ sndMuted = localStorage.getItem(SND_KEY) === "1"; }catch(e){}
function ensureAudio(){
  if(actx){ if(actx.state === "suspended"){ try{ actx.resume(); }catch(e){} } return actx; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    actx = new AC();
  }catch(e){ actx = null; }
  return actx;
}
document.addEventListener("pointerdown", () => { ensureAudio(); }, {passive: true});
function tone(freq, dur, opts){
  opts = opts || {};
  if(sndMuted || !actx) return;
  try{
    const t0 = actx.currentTime + (opts.delay || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    const vol = opts.vol != null ? opts.vol : 0.08;
    o.type = opts.type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if(opts.slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, opts.slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }catch(e){}
}
function sndSlide(){ tone(210, 0.055, {type: "triangle", vol: 0.07, slideTo: 130}); }
function sndTick(){ tone(880, 0.05, {type: "sine", vol: 0.05}); }
function sndFanfare(){
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.16, {type: "triangle", vol: 0.09, delay: i * 0.09}));
}
function sndAllClear(){
  [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5].forEach((f, i) =>
    tone(f, i === 6 ? 0.34 : 0.15, {type: "triangle", vol: 0.09, delay: i * 0.1}));
}
function updateSndBtn(){
  const b = document.getElementById("btn-sound");
  if(b) b.textContent = sndMuted ? "🔇" : "🔊";
}
function toggleSound(){
  sndMuted = !sndMuted;
  try{ localStorage.setItem(SND_KEY, sndMuted ? "1" : "0"); }catch(e){}
  updateSndBtn();
  if(!sndMuted){ ensureAudio(); sndTick(); }
  return sndMuted;
}

let stage = 0; // 0始まり
let cells = [], moves = 0, startedAt = null, elapsed = 0, timerId = null, cleared = false;
let startCells = null, lastClearMs = null, lastClearMoves = null;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function scramble(sd){
  const rnd = mulberry32(sd);
  const st = [];
  for(let i = 0; i < N; i++) st.push(i);
  let blank = BLANK, prev = -1;
  for(let k = 0; k < 140; k++){
    const bx = blank % COLS, by = Math.floor(blank / COLS);
    const opts = [];
    for(let c = 0; c < N; c++){
      const cx = c % COLS, cy = Math.floor(c / COLS);
      if(Math.abs(cx - bx) + Math.abs(cy - by) === 1 && c !== prev) opts.push(c);
    }
    const pick = opts[Math.floor(rnd() * opts.length)];
    prev = blank;
    st[blank] = st[pick]; st[pick] = BLANK; blank = pick;
  }
  if(st.every((v, i) => v === i)) return scramble(sd + 1);
  return st;
}
function isSolved(){ return cells.every((v, i) => v === i); }
function fmtTime(ms){
  if(ms == null) return "-";
  const t = Math.floor(ms / 100);
  const m = Math.floor(t / 600), s = Math.floor(t / 10) % 60, d = t % 10;
  return m + ":" + String(s).padStart(2, "0") + "." + d;
}
function loadRecords(){
  try{
    const r = JSON.parse(localStorage.getItem(REC_KEY) || "{}");
    return {stages: r.stages || {}};
  }catch(e){ return {stages: {}}; }
}
function saveRecords(r){
  try{ localStorage.setItem(REC_KEY, JSON.stringify(r)); }catch(e){}
}
function stats(){
  const r = loadRecords();
  const per = [];
  for(let i = 0; i < IMAGES.length; i++){
    const rec = r.stages[String(i + 1)];
    per.push(rec ? rec.ms : null);
  }
  const clearedCount = per.filter(v => v != null).length;
  const all = clearedCount === IMAGES.length;
  const total = all ? per.reduce((a, b) => a + b, 0) : null;
  return {perStage: per, clearedCount: clearedCount, total: total, average: all ? total / IMAGES.length : null};
}
function renderSelect(){
  const grid = document.getElementById("stage-grid");
  grid.innerHTML = "";
  const st = stats();
  IMAGES.forEach((src, i) => {
    const rec = loadRecords().stages[String(i + 1)];
    const card = document.createElement("button");
    card.className = "stage-card" + (rec ? " cleared" : "");
    card.innerHTML = '<img src="' + src + '" alt="">' +
      '<div class="sname">' + (i + 1) + "面" + (rec ? " ✅" : "") + "</div>" +
      '<div class="stime">' + (rec ? "ベスト <b>" + fmtTime(rec.ms) + "</b>（" + rec.moves + "手）" : "未クリア") + "</div>";
    card.addEventListener("click", () => { sndTick(); startStage(i); });
    grid.appendChild(card);
  });
  const sum = document.getElementById("summary");
  if(st.total != null){
    sum.innerHTML = "🏆 <b>全" + IMAGES.length + "面クリア！</b><br>合計タイム <b>" + fmtTime(st.total) + "</b> ／ 平均タイム <b>" + fmtTime(Math.round(st.average)) + "</b>";
    document.getElementById("btn-share-all").style.display = "";
  }else{
    sum.innerHTML = "クリア済み <b>" + st.clearedCount + " / " + IMAGES.length + "</b> 面（全" + IMAGES.length + "面クリアで合計・平均タイムが出るよ）";
    document.getElementById("btn-share-all").style.display = "none";
  }
}
function startTimer(){
  if(timerId) return;
  startedAt = Date.now();
  timerId = setInterval(() => {
    elapsed = Date.now() - startedAt;
    document.getElementById("info-time").textContent = fmtTime(elapsed);
  }, 100);
}
function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}
function buildTiles(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  for(let t = 0; t < N - 1; t++){
    const el = document.createElement("div");
    el.className = "tile";
    el.id = "tile-" + t;
    el.style.backgroundImage = "url(" + IMAGES[stage] + ")";
    el.style.backgroundSize = (COLS * 100) + "% " + (ROWS * 100) + "%";
    el.style.backgroundPosition = ((t % COLS) * 100 / (COLS - 1)) + "% " + (Math.floor(t / COLS) * 100 / (ROWS - 1)) + "%";
    el.innerHTML = '<span class="num">' + (t + 1) + "</span>";
    el.addEventListener("click", () => onTileTap(t));
    board.appendChild(el);
  }
  document.getElementById("preview").style.backgroundImage = "url(" + IMAGES[stage] + ")";
}
function render(){
  for(let c = 0; c < N; c++){
    const t = cells[c];
    if(t === BLANK) continue;
    const el = document.getElementById("tile-" + t);
    if(el) el.style.transform = "translate(" + (c % COLS) * 100 + "%, " + Math.floor(c / COLS) * 100 + "%)";
  }
  document.getElementById("info-stage").textContent = (stage + 1) + "面";
  document.getElementById("info-moves").textContent = moves;
  const rec = loadRecords().stages[String(stage + 1)];
  document.getElementById("info-best").textContent = rec ? fmtTime(rec.ms) : "-";
}
function startStage(i){
  stage = i;
  const sd = (STAGE_SEEDS[i] * 1000003 + Math.floor(Math.random() * 0x7fffffff)) >>> 0;
  cells = scramble(sd);
  startCells = cells.slice();
  moves = 0; elapsed = 0; cleared = false; startedAt = null;
  stopTimer();
  document.getElementById("info-time").textContent = "0:00.0";
  document.getElementById("clear-panel").style.display = "none";
  document.getElementById("screen-select").style.display = "none";
  document.getElementById("screen-play").style.display = "";
  buildTiles(); render();
}
function backToSelect(){
  stopTimer();
  document.getElementById("screen-play").style.display = "none";
  document.getElementById("screen-select").style.display = "";
  renderSelect();
}
function resetAttempt(){
  if(!startCells) return;
  cells = startCells.slice();
  moves = 0; elapsed = 0; cleared = false; startedAt = null;
  stopTimer();
  document.getElementById("info-time").textContent = "0:00.0";
  document.getElementById("clear-panel").style.display = "none";
  render();
}
function onTileTap(tileId){
  if(cleared) return;
  const c = cells.indexOf(tileId);
  const b = cells.indexOf(BLANK);
  const cx = c % COLS, cy = Math.floor(c / COLS), bx = b % COLS, by = Math.floor(b / COLS);
  if(cx !== bx && cy !== by) return;
  if(!startedAt) startTimer();
  let slid = 0;
  if(cy === by){
    const dir = cx < bx ? 1 : -1;
    for(let x = bx; x !== cx; x -= dir){ cells[cy * COLS + x] = cells[cy * COLS + x - dir]; slid++; }
    cells[c] = BLANK;
  }else{
    const dir = cy < by ? 1 : -1;
    for(let y = by; y !== cy; y -= dir){ cells[y * COLS + cx] = cells[(y - dir) * COLS + cx]; slid++; }
    cells[c] = BLANK;
  }
  moves += slid;
  render();
  sndSlide();
  if(isSolved()) onClear();
}
function onClear(){
  cleared = true;
  stopTimer();
  elapsed = startedAt ? Date.now() - startedAt : 0;
  lastClearMs = elapsed; lastClearMoves = moves;
  const r = loadRecords();
  const key = String(stage + 1);
  const prev = r.stages[key];
  const isBest = !prev || elapsed < prev.ms;
  if(isBest) r.stages[key] = {ms: elapsed, moves: moves};
  saveRecords(r);
  const st = stats();
  document.getElementById("clear-title").textContent = st.total != null ? "🏆 全面クリア！" : "🎉 " + (stage + 1) + "面クリア！";
  document.getElementById("clear-time").textContent = fmtTime(elapsed);
  document.getElementById("clear-detail").textContent = moves + "手" + (isBest ? " ・ ベスト更新！" : " ・ ベスト " + fmtTime(prev.ms));
  document.getElementById("clear-total").innerHTML = st.total != null
    ? "合計タイム <b>" + fmtTime(st.total) + "</b> ／ 平均タイム <b>" + fmtTime(Math.round(st.average)) + "</b>"
    : "クリア済み " + st.clearedCount + " / " + IMAGES.length + " 面";
  document.getElementById("btn-next-stage").style.display = stage < IMAGES.length - 1 ? "" : "none";
  document.getElementById("clear-panel").style.display = "flex";
  if(st.total != null) sndAllClear(); else sndFanfare();
  render();
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(() => alert("コピーしたよ"), () => prompt("コピーしてね", txt));
  }else{
    prompt("コピーしてね", txt);
  }
}
function shareText(txt){
  if(navigator.share){ navigator.share({text: txt}).catch(() => copyText(txt)); }
  else copyText(txt);
}
function shareStage(){
  shareText("🖼️ 世界名画コレクション～パズルで見る7分さん～ " + (stage + 1) + "面を " + fmtTime(lastClearMs) + "（" + lastClearMoves + "手）でクリア！");
}
function shareAll(){
  const st = stats();
  if(st.total == null) return;
  const lines = st.perStage.map((ms, i) => (i + 1) + "面 " + fmtTime(ms)).join(" ／ ");
  shareText("🖼️ 世界名画コレクション～パズルで見る7分さん～ 全" + IMAGES.length + "面クリア！ 合計 " + fmtTime(st.total) + " ／ 平均 " + fmtTime(Math.round(st.average)) + "\n" + lines);
}
document.getElementById("btn-sound").addEventListener("click", toggleSound);
updateSndBtn();
document.getElementById("btn-next-stage").addEventListener("click", () => { if(stage < IMAGES.length - 1) startStage(stage + 1); });
document.getElementById("btn-again").addEventListener("click", resetAttempt);
document.getElementById("btn-reset").addEventListener("click", resetAttempt);
document.getElementById("btn-back").addEventListener("click", backToSelect);
document.getElementById("btn-back2").addEventListener("click", backToSelect);
document.getElementById("btn-share").addEventListener("click", shareStage);
document.getElementById("btn-share-all").addEventListener("click", shareAll);
document.getElementById("btn-reset-records").addEventListener("click", () => {
  if(confirm("記録を全部消す？")){
    try{ localStorage.removeItem(REC_KEY); }catch(e){}
    renderSelect();
  }
});
const prev = document.getElementById("btn-show-preview");
const pv = document.getElementById("preview");
prev.addEventListener("touchstart", () => { pv.style.display = "block"; }, {passive: true});
prev.addEventListener("touchend", () => { pv.style.display = "none"; });
prev.addEventListener("mousedown", () => { pv.style.display = "block"; });
prev.addEventListener("mouseup", () => { pv.style.display = "none"; });
prev.addEventListener("click", () => {
  pv.style.display = pv.style.display === "block" ? "none" : "block";
  setTimeout(() => { pv.style.display = "none"; }, 1200);
});
document.getElementById("chk-num").addEventListener("change", (e) => {
  document.body.classList.toggle("show-num", e.target.checked);
});
document.body.classList.add("show-num");
renderSelect();

window.PZ = {
  getState: () => ({stage: stage, cells: cells.slice(), moves: moves, cleared: cleared}),
  startStage: startStage,
  backToSelect: backToSelect,
  scramble: scramble,
  setCells: (arr) => { cells = arr.slice(); render(); },
  tap: onTileTap,
  isSolved: isSolved,
  stats: stats,
  loadRecords: loadRecords,
  soundMuted: () => sndMuted,
  toggleSound: toggleSound
};
</script>
</body>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>7分さんの人生すごろく</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#43307a,#241a45); color:#fff;
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    padding:8px; user-select:none; -webkit-user-select:none;
  }
  .wrap{ flex:1; min-height:0; display:flex; flex-direction:column; width:100%; max-width:480px; margin:0 auto; }
  .head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  h1{ font-size:17px; letter-spacing:.03em; text-align:left; }
  h1 .sub{ display:block; font-size:10px; font-weight:400; opacity:.85; margin-top:1px; }
  .panels{ display:flex; gap:6px; margin-top:6px; }
  .pcard{ flex:1; min-width:0; background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.18); border-radius:10px; padding:5px 8px; text-align:left; font-size:11px; line-height:1.45; }
  .pcard.active{ border-color:#ffd94d; background:rgba(255,217,77,.13); }
  .pcard.goaled{ opacity:.72; }
  .pcard .nm{ display:flex; align-items:center; gap:5px; font-weight:800; font-size:12.5px; }
  .pcard .nm img{ width:22px; height:22px; border-radius:50%; object-fit:cover; border:2px solid #ffd94d; flex:none; }
  .pcard.p1 .nm img{ border-color:#6cc4ff; }
  .pcard .money{ margin-left:auto; font-size:13.5px; font-weight:800; white-space:nowrap; }
  .pcard .det{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .neg{ color:#ff9a9a; }
  #board{ position:relative; height:116px; flex:none; margin-top:8px; overflow:hidden; border-radius:10px; background:rgba(0,0,0,.18); }
  #strip{ position:absolute; left:0; top:0; height:100%; transition:transform .35s ease; }
  .track{ position:absolute; left:0; width:100%; border-top:3px dotted rgba(255,255,255,.28); }
  .cell{ position:absolute; width:42px; height:50px; border-radius:6px; background:rgba(255,255,255,.10); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .cell .ic{ font-size:13px; line-height:1; }
  .cell .lb{ font-size:7.5px; line-height:1.15; opacity:.92; margin-top:1px; }
  .cell.active{ outline:3px solid #ffd94d; outline-offset:-3px; animation:pulse .45s infinite alternate; z-index:2; }
  @keyframes pulse{ from{ transform:scale(1); } to{ transform:scale(1.08); } }
  .cell.uni{ box-shadow:inset 0 0 0 2px rgba(110,160,255,.45); }
  .cell.jobr{ box-shadow:inset 0 0 0 2px rgba(255,170,90,.45); }
  .t-payday{ background:rgba(80,200,120,.34); }
  .t-lucky{ background:rgba(255,210,80,.32); }
  .t-unlucky{ background:rgba(230,90,90,.30); }
  .t-child{ background:rgba(255,180,120,.34); }
  .t-marriage{ background:rgba(255,150,200,.36); }
  .t-house{ background:rgba(120,170,255,.34); }
  .t-gamble{ background:rgba(190,120,255,.34); }
  .t-change{ background:rgba(120,220,210,.30); }
  .t-job,.t-jobu{ background:rgba(120,170,255,.30); }
  .t-bonus{ background:rgba(255,180,220,.34); }
  .t-fork{ background:rgba(255,255,255,.30); }
  .t-start{ background:rgba(255,255,255,.38); }
  .t-goal{ background:#ffd94d; color:#3a2b00; }
  .toks{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:1px; pointer-events:none; }
  .tok{ width:46%; max-width:19px; aspect-ratio:1; border-radius:50%; object-fit:cover; border:2px solid #ffd94d; background:#fff; animation:hop .2s ease; }
  .tok1{ border-color:#6cc4ff; }
  @keyframes hop{ 0%{ transform:translateY(0); } 40%{ transform:translateY(-4px); } 100%{ transform:translateY(0); } }
  #msg{ flex:none; margin-top:8px; font-size:13px; line-height:1.4; color:#ffe9a8; background:rgba(0,0,0,.25); border-radius:8px; padding:5px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #choice{ flex:none; margin-top:8px; display:none; gap:8px; justify-content:center; flex-wrap:wrap; }
  button{
    font:inherit; font-size:14.5px; font-weight:700; color:#33240a;
    background:#ffd94d; border:none; border-radius:999px; padding:10px 18px; cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  button.sub{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); box-shadow:none; }
  button:disabled{ opacity:.45; box-shadow:none; }
  button:active{ transform:scale(.96); }
  .chipbtn{ font:inherit; flex:none; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:4px 11px; font-size:13px; color:#fff; cursor:pointer; box-shadow:none; }
  .chipbtn:active{ transform:scale(.94); }
  .rwrap{ flex:none; display:flex; align-items:center; justify-content:center; gap:14px; margin-top:10px; }
  #rnum{ width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:27px; font-weight:800; flex:none; }
  #log{ flex:1; min-height:0; margin-top:10px; overflow-y:auto; text-align:left; font-size:12px; line-height:1.65; background:rgba(0,0,0,.28); border-radius:10px; padding:8px 11px; }
  #result{ position:fixed; inset:0; background:rgba(12,8,30,.74); display:flex; align-items:center; justify-content:center; z-index:10; padding:20px; }
  #result.hidden{ display:none; }
  .card{ background:#fff; color:#2b2620; border-radius:20px; padding:24px 26px; text-align:center; max-width:330px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .card h2{ font-size:21px; margin-bottom:10px; }
  .card p{ font-size:14px; line-height:1.7; margin-bottom:8px; }
  .card button{ margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🎲 7分さんの人生すごろく<span class="sub">ルーレットで進んで、ゴールした時の資産を競うよ</span></h1>
    <button class="chipbtn" id="snd" type="button">🔊</button>
  </div>
  <div class="panels">
    <div class="pcard p0" id="p0-card">
      <div class="nm"><img id="p0-img" alt="">あなた<span class="money" id="p0-money">¥100,000</span></div>
      <div class="det"><span id="p0-job">まだなし</span>（給料 <span id="p0-sal">-</span>）</div>
      <div class="det"><span id="p0-fam">独身 / 子供 0人</span> ・ 家：<span id="p0-house">なし</span></div>
    </div>
    <div class="pcard p1" id="p1-card">
      <div class="nm"><img id="p1-img" alt="">CPU<span class="money" id="p1-money">¥100,000</span></div>
      <div class="det"><span id="p1-job">まだなし</span>（給料 <span id="p1-sal">-</span>）</div>
      <div class="det"><span id="p1-fam">独身 / 子供 0人</span> ・ 家：<span id="p1-house">なし</span></div>
    </div>
  </div>
  <div id="board"><div id="strip"></div></div>
  <div id="msg"></div>
  <div id="choice"></div>
  <div class="rwrap">
    <div id="rnum">?</div>
    <button id="roll">🎲 ルーレットを回す</button>
  </div>
  <div id="log"></div>
</div>

<div id="result" class="hidden">
  <div class="card">
    <h2 id="r-title">🎉 ゴール！</h2>
    <div id="r-detail"></div>
    <button id="again">もう一度遊ぶ</button>
  </div>
</div>

/* ---- sound: Web Audio synthesized effects, no audio files ---- */
const SND_KEY = 'nanahun-snd-jinsei';
let sndMuted = false;
try { sndMuted = localStorage.getItem(SND_KEY) === '1'; } catch (e) { sndMuted = false; }
let actx = null;
function audio(){
  if (sndMuted) return null;
  try {
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, dur, opts){
  const ac = audio();
  if (!ac) return;
  opts = opts || {};
  const t0 = ac.currentTime + (opts.delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = opts.type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (opts.slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, opts.slideTo), t0 + dur);
  const v = opts.vol || 0.08;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function sfxTick(){ tone(920, 0.03, {type: 'square', vol: 0.03}); }
function sfxStep(){ tone(560, 0.05, {type: 'triangle', vol: 0.05}); }
function sfxGood(){ [523, 659, 784].forEach((f, i) => tone(f, 0.13, {type: 'triangle', vol: 0.08, delay: i * 0.07})); }
function sfxBad(){ tone(170, 0.22, {type: 'sawtooth', vol: 0.05, slideTo: 105}); }
function sfxPay(){ tone(880, 0.09, {type: 'triangle', vol: 0.085}); tone(1318, 0.15, {type: 'triangle', vol: 0.085, delay: 0.08}); }
function sfxGoal(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, {type: 'triangle', vol: 0.085, delay: i * 0.1})); }
function soundMuted(){ return sndMuted; }
function updateSndBtn(){ const b = $('snd'); if (b) b.textContent = sndMuted ? '🔇' : '🔊'; }
function toggleSound(){
  sndMuted = !sndMuted;
  try { localStorage.setItem(SND_KEY, sndMuted ? '1' : '0'); } catch (e) {}
  updateSndBtn();
  if (!sndMuted) sfxTick();
  return sndMuted;
}
document.addEventListener('pointerdown', () => { audio(); }, {passive: true});

const PREFIX = [0, 1, 2, 3, 4];
const UNI    = [5, 6, 7, 8, 9, 10, 11, 12];
const JOBR   = [13, 14, 15];
const MAIN   = [];
for (let i = 20; i <= 64; i++) MAIN.push(i);
/* 通り過ぎても必ず止まるマス */
const MUST_STOP = {fork: 1, job: 1, jobu: 1, marriage: 1, house: 1, goal: 1};

/* 横ストリップ盤面の座標： x = 経路順の列, lane 1 = 本線（就職ルート含む）, lane 0 = 大学ルート */
const CELL_W = 46, LANE_H = 54;
const COORDS = {};
PREFIX.forEach((id, i) => { COORDS[id] = {x: i, lane: 1}; });
UNI.forEach((id, i) => { COORDS[id] = {x: PREFIX.length + i, lane: 0}; });
JOBR.forEach((id, i) => { COORDS[id] = {x: PREFIX.length + i, lane: 1}; });
MAIN.forEach((id, i) => { COORDS[id] = {x: PREFIX.length + UNI.length + i, lane: 1}; });
const MAX_X = PREFIX.length + UNI.length + MAIN.length - 1;
const STRIP_W = (MAX_X + 1) * CELL_W;

/* ================= core game logic (no animation here) ================= */
let rng = Math.random;
function rf(){ return rng(); }
function pick(arr){ return arr[Math.min(arr.length - 1, Math.floor(rf() * arr.length))]; }
function fmt(n){ return (n < 0 ? '-¥' : '¥') + Math.abs(n).toLocaleString('ja-JP'); }

let players = [], turn = 0, phase = 'roll', pending = null, forcedRoll = null;
let over = false, winner = -1, autoCpu = true, logLines = [], dispPos = [null, null];
let camX = 0;

function newPlayer(name){
  return {name: name, money: START_MONEY, job: null, married: false, children: 0,
          house: null, route: null, degree: false, pos: 0, goaled: false};
}
function newGame(){
  players = [newPlayer('あなた'), newPlayer('CPU')];
  turn = 0; phase = 'roll'; pending = null; forcedRoll = null;
  over = false; winner = -1; logLines = []; dispPos = [null, null];
  $('result').classList.add('hidden');
  $('rnum').textContent = '?';
  log('分岐では大学（上の青レーン）か就職（下の本線）かを選ぶよ。就職・結婚・家・ゴールは必ず止まるマス。精算：資産 ＝ 所持金 ＋ 家の価値 ＋ 子供1人につき ¥300,000');
  log('ゲームスタート！ まずは分岐で進路を決めよう');
  render();
}
/* プレイヤーの進むマス列。就職ルートは合流マス(20)を飛ばして21から合流する */
function routeOf(p){
  const head = PREFIX.concat(p.route === 'uni' ? UNI : (p.route === 'job' ? JOBR : []));
  const main = (p.route === 'job') ? MAIN.slice(1) : MAIN;
  return head.concat(main);
}
function log(s){
  logLines.unshift(s);
  if (logLines.length > 80) logLines.pop();
  const el = $('log');
  if (el) el.innerHTML = logLines.join('<br>');
  const m = $('msg');
  if (m) m.textContent = s;
}
function drawJob(p, high){
  const list = (high || p.degree) ? JOBS_HIGH : JOBS_NORMAL;
  const j = pick(list);
  return {name: j.name, salary: j.salary};
}
/* roll 分進む。必止マスとゴールで止まる。踏んだ経路インデックスを返す */
function applyMove(p, roll){
  const route = routeOf(p);
  const visited = [];
  const steps = Math.min(roll, route.length - 1 - p.pos);
  for (let i = 0; i < steps; i++){
    p.pos++;
    visited.push(p.pos);
    if (MUST_STOP[NODES[route[p.pos]].t]) break;
  }
  return visited;
}
function doMove(p, roll){
  const visited = applyMove(p, roll);
  const nd = NODES[routeOf(p)[p.pos]];
  log(p.name + '： ルーレット ' + roll + ' → ' + nd.icon + ' ' + nd.label);
  return visited;
}
function resolveLanding(p){
  const idx = players.indexOf(p);
  const isCpu = idx === 1;
  const nd = NODES[routeOf(p)[p.pos]];
  switch (nd.t){
    case 'start':
      log(p.name + '： スタート地点'); break;
    case 'plain':
      log(p.name + '： ' + (nd.text || '何も起きなかった')); break;
    case 'bonus':
      p.money += nd.amt;
      log(p.name + '： ' + nd.text + ' +' + fmt(nd.amt)); sfxGood(); break;
    case 'payday': {
      const pay = p.job ? p.job.salary : BAITO_PAY;
      p.money += pay;
      log(p.name + '： 給料日！ ' + (p.job ? '' : '（アルバイト代）') + '+' + fmt(pay)); sfxPay(); break;
    }
    case 'lucky': {
      const e = pick(LUCKY);
      p.money += e.amt;
      log(p.name + '： 🍀 ' + e.text + ' +' + fmt(e.amt)); sfxGood(); break;
    }
    case 'unlucky': {
      const e = pick(UNLUCKY);
      p.money += e.amt;
      log(p.name + '： 💸 ' + e.text + ' ' + fmt(e.amt)); sfxBad(); break;
    }
    case 'child':
      p.children++;
      p.money += CHILD_BONUS;
      log(p.name + '： 👶 子供が生まれた！（' + p.children + '人目）出産祝い +' + fmt(CHILD_BONUS)); sfxGood(); break;
    case 'change':
      p.job = drawJob(p, false);
      log(p.name + '： 🔄 転職した！ 新しい職業は「' + p.job.name + '」（給料 ' + fmt(p.job.salary) + '）'); sfxGood(); break;
    case 'job':
      p.job = drawJob(p, false);
      log(p.name + '： 💼 就職した！ 職業は「' + p.job.name + '」（給料 ' + fmt(p.job.salary) + '）'); sfxGood(); break;
    case 'jobu':
      p.degree = true;
      p.job = drawJob(p, true);
      log(p.name + '： 🎓 大学を卒業して就職！ 職業は「' + p.job.name + '」（給料 ' + fmt(p.job.salary) + '）'); sfxGood(); break;
    case 'fork':
      if (isCpu) applyFork(p, rf() < 0.55 ? 'uni' : 'job');
      else { pending = {type: 'fork'}; log(p.name + '： 🔀 分岐！ 大学へ行くか、すぐ就職するか選んでね'); }
      break;
    case 'marriage': {
      if (!p.married){
        p.married = true;
        const opp = players[1 - idx];
        opp.money -= GIFT;
        p.money += GIFT;
        log(p.name + '： 💒 結婚した！ ' + opp.name + 'から祝儀 ' + fmt(GIFT) + ' をもらった'); sfxGood();
      } else {
        log(p.name + '： 💒 もう結婚している');
      }
      break;
    }
    case 'house':
      if (p.house) log(p.name + '： 🏠 もう家を持っている（' + p.house.name + '）');
      else if (isCpu) cpuHouse(p);
      else { pending = {type: 'house'}; log(p.name + '： 🏠 家を買うチャンス！ どうする？'); }
      break;
    case 'gamble':
      if (isCpu) doGamble(p, cpuBet(p));
      else { pending = {type: 'gamble'}; log(p.name + '： 🎰 ギャンブル勝負！ いくらかける？'); }
      break;
    case 'goal':
      p.goaled = true;
      log(p.name + '： 🏆 ゴール！！'); sfxGoal(); break;
  }
  render();
}
/* ---- fork ---- */
function applyFork(p, routeName){
  p.route = routeName;
  if (routeName === 'uni'){
    p.money -= TUITION;
    p.degree = true;
    log(p.name + '： 🎓 大学へ進学！ 授業料 ' + fmt(TUITION) + ' を払った');
  } else {
    log(p.name + '： 💼 すぐ就職する道を選んだ');
  }
  render();
}
function chooseFork(routeName){
  if (!pending || pending.type !== 'fork') return;
  const p = players[turn];
  pending = null;
  applyFork(p, routeName === 'uni' ? 'uni' : 'job');
  finishTurn();
}
/* ---- house ---- */
function applyHouse(p, tierIdx){
  if (tierIdx < 0){ log(p.name + '： 🏠 家は買わなかった'); render(); return; }
  const h = HOUSES[tierIdx];
  p.money -= h.price;
  p.house = {name: h.name, price: h.price};
  log(p.name + '： 🏠 ' + h.name + 'を買った！ ' + fmt(h.price)); sfxPay();
  render();
}
function cpuHouse(p){
  if (rf() < 0.5){
    for (let i = HOUSES.length - 1; i >= 0; i--){
      if (p.money >= HOUSES[i].price){ applyHouse(p, i); return; }
    }
  }
  log(p.name + '： 🏠 家は買わなかった');
  render();
}
function chooseHouse(tierIdx){
  if (!pending || pending.type !== 'house') return;
  const p = players[turn];
  pending = null;
  if (tierIdx >= 0 && p.money < HOUSES[tierIdx].price) tierIdx = -1;
  applyHouse(p, tierIdx);
  finishTurn();
}
/* ---- gamble ---- */
function doGamble(p, bet){
  if (!bet){ log(p.name + '： 🎰 ギャンブルはパスした'); render(); return; }
  if (rf() < 0.5){
    p.money += bet;
    log(p.name + '： 🎰 ' + fmt(bet) + ' かけて勝った！ +' + fmt(bet)); sfxGood();
  } else {
    p.money -= bet;
    log(p.name + '： 🎰 ' + fmt(bet) + ' かけて負けた… ' + fmt(-bet)); sfxBad();
  }
  render();
}
function cpuBet(p){
  const opts = [0, 50000, 100000].filter(b => b <= p.money);
  return opts.length ? pick(opts) : 0;
}
function chooseGamble(bet){
  if (!pending || pending.type !== 'gamble') return;
  const p = players[turn];
  pending = null;
  if ([0, 50000, 100000].indexOf(bet) < 0) bet = 0;
  doGamble(p, bet);
  finishTurn();
}
/* ---- settlement ---- */
function settle(){
  return players.map(p => {
    const hv = p.house ? p.house.price : 0;
    const cv = p.children * CHILD_VALUE;
    return {money: p.money, houseValue: hv, childValue: cv, assets: p.money + hv + cv};
  });
}
function computeWinner(){
  const s = settle();
  if (s[0].assets === s[1].assets) return -1;
  return s[0].assets > s[1].assets ? 0 : 1;
}
function endGame(){
  over = true;
  phase = 'over';
  winner = computeWinner();
  const s = settle();
  let html = '';
  players.forEach((p, i) => {
    html += '<p>' + (i === 0 ? '🟡 あなた' : '🔵 CPU') + '<br>所持金 ' + fmt(s[i].money) +
            '<br>＋ 家の価値 ' + fmt(s[i].houseValue) +
            '<br>＋ 子供 ' + p.children + '人 ' + fmt(s[i].childValue) +
            '<br>＝ 資産 <b>' + fmt(s[i].assets) + '</b></p>';
  });
  $('r-detail').innerHTML = html;
  $('r-title').textContent = winner === -1 ? '🤝 引き分け！' : (winner === 0 ? '🎉 あなたの勝ち！' : '🏆 CPUの勝ち！');
  $('result').classList.remove('hidden');
  log(winner === -1 ? '結果： 引き分け！' : '結果： ' + players[winner].name + ' の勝ち！');
  sfxGoal();
  render();
}
function finishTurn(){
  if (players.every(p => p.goaled)){ endGame(); return; }
  if (!players[1 - turn].goaled) turn = 1 - turn;
  phase = (turn === 1) ? 'cpu' : 'roll';
  render();
  scheduleCpu();
}
function afterResolve(){
  if (pending){ phase = 'choice'; render(); return; }
  finishTurn();
}
function nextRoll(){
  if (forcedRoll != null){ const v = forcedRoll; forcedRoll = null; return v; }
  return 1 + Math.floor(rf() * 10);
}
/* 同期的に1ターン進める（テスト用。CPUの選択は自動） */
function takeTurn(roll){
  if (over) return;
  const p = players[turn];
  if (p.goaled){ finishTurn(); return; }
  const r = (roll == null) ? nextRoll() : roll;
  phase = 'busy';
  doMove(p, r);
  resolveLanding(p);
  afterResolve();
}

/* ================= UI ================= */
/* カメラ：手番プレイヤーの表示中マスがビューポート中央に来るようストリップを横移動 */
function focusNodeId(){
  const p = players[turn];
  const pos = dispPos[turn] != null ? dispPos[turn] : p.pos;
  return routeOf(p)[pos];
}
function applyCamera(){
  const vp = $('board'), st = $('strip');
  if (!vp || !st) return;
  const vw = vp.clientWidth || 0;
  if (vw > 0){
    if (STRIP_W <= vw){
      camX = (vw - STRIP_W) / 2;
    } else {
      const cd = COORDS[focusNodeId()];
      const tx = vw / 2 - (cd.x * CELL_W + CELL_W / 2);
      camX = Math.max(vw - STRIP_W, Math.min(0, tx));
    }
  }
  st.style.transform = 'translateX(' + camX + 'px)';
}
function render(){
  for (let i = 0; i < 2; i++){
    const p = players[i], pre = 'p' + i;
    $(pre + '-job').textContent = p.job ? p.job.name : 'まだなし';
    $(pre + '-sal').textContent = p.job ? fmt(p.job.salary) : '-';
    const mEl = $(pre + '-money');
    mEl.textContent = fmt(p.money);
    mEl.classList.toggle('neg', p.money < 0);
    $(pre + '-fam').textContent = (p.married ? '結婚💒' : '独身') + ' / 子供 ' + p.children + '人';
    $(pre + '-house').textContent = p.house ? p.house.name : 'なし';
    $(pre + '-card').classList.toggle('active', turn === i && !over);
    $(pre + '-card').classList.toggle('goaled', p.goaled);
  }
  const strip = $('strip');
  strip.innerHTML = '';
  strip.style.width = STRIP_W + 'px';
  for (let lane = 0; lane < 2; lane++){
    const tr = document.createElement('div');
    tr.className = 'track';
    tr.style.top = (lane * LANE_H + LANE_H / 2) + 'px';
    strip.appendChild(tr);
  }
  const curNode = over ? -1 : routeOf(players[turn])[players[turn].pos];
  for (const key in NODES){
    const id = +key, nd = NODES[key], cd = COORDS[id];
    const cell = document.createElement('div');
    cell.className = 'cell t-' + nd.t + (UNI.indexOf(id) >= 0 ? ' uni' : '') + (JOBR.indexOf(id) >= 0 ? ' jobr' : '');
    cell.dataset.node = String(id);
    cell.style.left = (cd.x * CELL_W + 2) + 'px';
    cell.style.top = (cd.lane * LANE_H + 2) + 'px';
    if (id === curNode) cell.classList.add('active');
    cell.innerHTML = '<div class="ic">' + nd.icon + '</div><div class="lb">' + nd.label + '</div>';
    const tk = document.createElement('div');
    tk.className = 'toks';
    for (let i = 0; i < 2; i++){
      const r = routeOf(players[i]);
      const pos = dispPos[i] != null ? dispPos[i] : players[i].pos;
      if (r[pos] === id){
        const img = document.createElement('img');
        img.src = IMGS[i];
        img.className = 'tok tok' + i;
        img.alt = '';
        tk.appendChild(img);
      }
    }
    cell.appendChild(tk);
    strip.appendChild(cell);
  }
  applyCamera();
  $('roll').disabled = !(phase === 'roll' && turn === 0 && !over);
  renderChoice();
}
function mkBtn(label, fn, cls){
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  if (cls) b.className = cls;
  b.addEventListener('click', fn);
  return b;
}
function renderChoice(){
  const box = $('choice');
  box.innerHTML = '';
  if (!pending || turn !== 0){ box.style.display = 'none'; return; }
  box.style.display = 'flex';
  const p = players[0];
  if (pending.type === 'fork'){
    box.appendChild(mkBtn('🎓 大学へ行く（授業料 ' + fmt(TUITION) + '）', () => chooseFork('uni')));
    box.appendChild(mkBtn('💼 すぐ就職する', () => chooseFork('job'), 'sub'));
  } else if (pending.type === 'house'){
    HOUSES.forEach((h, i) => {
      const b = mkBtn('🏠 ' + h.name + ' ' + fmt(h.price), () => chooseHouse(i));
      if (p.money < h.price) b.disabled = true;
      box.appendChild(b);
    });
    box.appendChild(mkBtn('買わない', () => chooseHouse(-1), 'sub'));
  } else if (pending.type === 'gamble'){
    [0, 50000, 100000].forEach(v => {
      box.appendChild(mkBtn(v === 0 ? 'パスする' : fmt(v) + ' かける', () => chooseGamble(v), v === 0 ? 'sub' : ''));
    });
  }
}
/* ---- animations ---- */
function spinAnim(finalRoll, cb){
  const disp = $('rnum');
  let n = 0;
  const total = 9;
  (function tick(){
    n++;
    if (n < total){
      disp.textContent = String(1 + Math.floor(Math.random() * 10));
      sfxTick();
      setTimeout(tick, 40 + n * 16);
    } else {
      disp.textContent = String(finalRoll);
      sfxTick();
      cb();
    }
  })();
}
function stepAnim(p, visited, cb){
  const idx = players.indexOf(p);
  let i = 0;
  (function next(){
    if (i >= visited.length){
      dispPos[idx] = null;
      render();
      cb();
      return;
    }
    dispPos[idx] = visited[i];
    i++;
    sfxStep();
    render();
    setTimeout(next, 230);
  })();
}
function uiPlayTurn(){
  const p = players[turn];
  phase = 'busy';
  render();
  const roll = nextRoll();
  spinAnim(roll, () => {
    const visited = doMove(p, roll);
    stepAnim(p, visited, () => {
      resolveLanding(p);
      afterResolve();
    });
  });
}
function uiRoll(){
  if (over || turn !== 0 || phase !== 'roll') return;
  if (players[0].goaled){ finishTurn(); return; }
  uiPlayTurn();
}
function uiCpuTurn(){
  if (over || turn !== 1) return;
  if (players[1].goaled){ finishTurn(); return; }
  uiPlayTurn();
}
function scheduleCpu(){
  if (!autoCpu || over) return;
  if (turn === 1) setTimeout(uiCpuTurn, 1000);
}
window.addEventListener('resize', applyCamera);
$('roll').addEventListener('click', uiRoll);
$('snd').addEventListener('click', toggleSound);
$('again').addEventListener('click', newGame);
$('p0-img').src = IMGS[0];
$('p1-img').src = IMGS[1];
updateSndBtn();

/* ================= test hooks ================= */
function state(){
  return {
    players: players.map(p => ({
      name: p.name, money: p.money,
      job: p.job ? {name: p.job.name, salary: p.job.salary} : null,
      married: p.married, children: p.children,
      house: p.house ? {name: p.house.name, price: p.house.price} : null,
      route: p.route, degree: p.degree, pos: p.pos,
      node: routeOf(p)[p.pos], goaled: p.goaled
    })),
    turn: turn, phase: phase,
    pending: pending ? {type: pending.type} : null,
    over: over, winner: winner
  };
}
function setPlayer(i, props){
  if (players[i]) Object.assign(players[i], props);
  render();
}
window.JINSEI = {
  state: state,
  newGame: newGame,
  takeTurn: takeTurn,
  forceRoll: v => { forcedRoll = v; },
  setRng: fn => { rng = fn || Math.random; },
  setAutoCpu: b => { autoCpu = !!b; },
  chooseFork: chooseFork,
  chooseHouse: chooseHouse,
  chooseGamble: chooseGamble,
  settle: settle,
  routeOf: i => routeOf(players[i]).slice(),
  setPlayer: setPlayer,
  nodeCoord: i => { const c = COORDS[i]; return c ? {x: c.x, lane: c.lane} : null; },
  cameraX: () => camX,
  layout: {cellW: CELL_W, laneH: LANE_H, stripW: STRIP_W, maxX: MAX_X},
  soundMuted: soundMuted,
  toggleSound: toggleSound,
  data: {JOBS_NORMAL: JOBS_NORMAL, JOBS_HIGH: JOBS_HIGH, HOUSES: HOUSES, LUCKY: LUCKY, UNLUCKY: UNLUCKY, NODES: NODES}
};
newGame();
</script>
</body>

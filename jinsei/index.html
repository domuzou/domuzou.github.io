<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>7分さんの人生すごろく</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(180deg,#43307a,#241a45); color:#fff;
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    padding:8px; user-select:none; -webkit-user-select:none;
  }
  .wrap{ flex:1; min-height:0; display:flex; flex-direction:column; width:100%; max-width:480px; margin:0 auto; }
  .head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  h1{ font-size:17px; letter-spacing:.03em; text-align:left; }
  h1 .sub{ display:block; font-size:10px; font-weight:400; opacity:.85; margin-top:1px; }
  .panels{ display:flex; gap:6px; margin-top:6px; }
  .pcard{ flex:1; min-width:0; background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.18); border-radius:10px; padding:5px 8px; text-align:left; font-size:11px; line-height:1.45; }
  .pcard.active{ border-color:#ffd94d; background:rgba(255,217,77,.13); }
  .pcard.goaled{ opacity:.72; }
  .pcard .nm{ display:flex; align-items:center; gap:5px; font-weight:800; font-size:12.5px; }
  .pcard .nm img{ width:22px; height:22px; border-radius:50%; object-fit:cover; border:2px solid #ffd94d; flex:none; }
  .pcard.p1 .nm img{ border-color:#6cc4ff; }
  .pcard .money{ margin-left:auto; font-size:13.5px; font-weight:800; white-space:nowrap; }
  .pcard .det{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .neg{ color:#ff9a9a; }
  #board{ position:relative; height:116px; flex:none; margin-top:8px; overflow:hidden; border-radius:10px; background:rgba(0,0,0,.18); }
  #strip{ position:absolute; left:0; top:0; height:100%; transition:transform .45s ease; }
  .track{ position:absolute; left:0; width:100%; border-top:3px dotted rgba(255,255,255,.28); }
  .cell{ position:absolute; width:42px; height:50px; border-radius:6px; background:rgba(255,255,255,.10); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  .cell .ic{ font-size:13px; line-height:1; }
  .cell .lb{ font-size:7.5px; line-height:1.15; opacity:.92; margin-top:1px; }
  .cell.active{ outline:3px solid #ffd94d; outline-offset:-3px; animation:pulse .45s infinite alternate; z-index:2; }
  @keyframes pulse{ from{ transform:scale(1); } to{ transform:scale(1.08); } }
  .cell.uni{ box-shadow:inset 0 0 0 2px rgba(110,160,255,.45); }
  .cell.jobr{ box-shadow:inset 0 0 0 2px rgba(255,170,90,.45); }
  .t-payday{ background:rgba(80,200,120,.34); }
  .t-lucky{ background:rgba(255,210,80,.32); }
  .t-unlucky{ background:rgba(230,90,90,.30); }
  .t-child{ background:rgba(255,180,120,.34); }
  .t-marriage{ background:rgba(255,150,200,.36); }
  .t-house{ background:rgba(120,170,255,.34); }
  .t-gamble{ background:rgba(190,120,255,.34); }
  .t-date{ background:rgba(255,120,160,.38); }
  .t-duel{ background:rgba(255,120,60,.38); }
  .t-change{ background:rgba(120,220,210,.30); }
  .t-job,.t-jobu,.t-employ{ background:rgba(120,170,255,.30); }
  .t-bonus{ background:rgba(255,180,220,.34); }
  .t-fork{ background:rgba(255,255,255,.30); }
  .t-study{ background:rgba(140,200,255,.32); }
  .t-uni{ background:rgba(150,130,255,.36); }
  .t-training{ background:rgba(120,170,255,.30); }
  .t-rest{ background:rgba(255,210,150,.30); }
  .t-exam{ background:rgba(255,255,255,.34); }
  .t-start{ background:rgba(255,255,255,.38); }
  .t-goal{ background:#ffd94d; color:#3a2b00; }
  .toks{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:1px; pointer-events:none; }
  .tok{ width:46%; max-width:19px; aspect-ratio:1; border-radius:50%; object-fit:cover; border:2px solid #ffd94d; background:#fff; animation:hop .2s ease; }
  .tok1{ border-color:#6cc4ff; }
  @keyframes hop{ 0%{ transform:translateY(0); } 40%{ transform:translateY(-4px); } 100%{ transform:translateY(0); } }
  #msg{ flex:none; margin-top:8px; font-size:13px; line-height:1.4; color:#ffe9a8; background:rgba(0,0,0,.25); border-radius:8px; padding:5px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #choice{ flex:none; margin-top:8px; display:none; gap:8px; justify-content:center; flex-wrap:wrap; }
  button{
    font:inherit; font-size:14.5px; font-weight:700; color:#33240a;
    background:#ffd94d; border:none; border-radius:999px; padding:10px 18px; cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  button.sub{ background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.4); box-shadow:none; }
  button:disabled{ opacity:.45; box-shadow:none; }
  button:active{ transform:scale(.96); }
  .chipbtn{ font:inherit; flex:none; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:4px 11px; font-size:13px; color:#fff; cursor:pointer; box-shadow:none; }
  .chipbtn:active{ transform:scale(.94); }
  .rwrap{ flex:none; display:flex; align-items:center; justify-content:center; gap:14px; margin-top:10px; }
  #rnum{ width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:27px; font-weight:800; flex:none; }
  #log{ flex:1; min-height:0; margin-top:10px; overflow-y:auto; text-align:left; font-size:12px; line-height:1.65; background:rgba(0,0,0,.28); border-radius:10px; padding:8px 11px; }
  #msg.ev-good{ color:#8dff9a; font-weight:800; }
  #msg.ev-bad{ color:#ff9a9a; font-weight:800; }
  #msg .amt{ font-size:1.2em; font-weight:800; }
  #log .lg-good{ color:#8dff9a; font-weight:700; }
  #log .lg-bad{ color:#ff9a9a; font-weight:700; }
  #log .amt{ font-size:1.14em; font-weight:800; }
  #result{ position:fixed; inset:0; background:rgba(12,8,30,.74); display:flex; align-items:center; justify-content:center; z-index:10; padding:20px; }
  #result.hidden{ display:none; }
  .card{ background:#fff; color:#2b2620; border-radius:20px; padding:24px 26px; text-align:center; max-width:330px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .card h2{ font-size:21px; margin-bottom:10px; }
  .card p{ font-size:14px; line-height:1.7; margin-bottom:8px; }
  .card button{ margin-top:10px; }
  .brand-logo{height:32px;width:auto;vertical-align:middle;pointer-events:none}
</style>
</head>

  <div class="head">

/* ---- sound: Web Audio synthesized effects, no audio files ---- */
const SND_KEY = 'nanahun-snd-jinsei';
let sndMuted = false;
try { sndMuted = localStorage.getItem(SND_KEY) === '1'; } catch (e) { sndMuted = false; }
let actx = null;
function audio(){
  if (sndMuted) return null;
  try {
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, dur, opts){
  const ac = audio();
  if (!ac) return;
  opts = opts || {};
  const t0 = ac.currentTime + (opts.delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = opts.type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (opts.slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, opts.slideTo), t0 + dur);
  const v = opts.vol || 0.08;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const PREFIX = [0, 16, 1, 17, 2, 18, 3, 4];

const MUST_STOP = {exam: 1, employ: 1, jobu: 1, marriage: 1, house: 1, goal: 1};

/* 横ストリップ盤面の座標： x = 経路順の列, lane 1 = 本線（就職ルート含む）, lane 0 = 大学ルート */
const CELL_W = 46, LANE_H = 54;
const COORDS = {};
PREFIX.forEach((id, i) => { COORDS[id] = {x: i, lane: 1}; });
UNI.forEach((id, i) => { COORDS[id] = {x: PREFIX.length + i, lane: 0}; });
JOBR.forEach((id, i) => { COORDS[id] = {x: PREFIX.length + i, lane: 1}; });
MAIN.forEach((id, i) => { COORDS[id] = {x: PREFIX.length + UNI.length + i, lane: 1}; });
const MAX_X = PREFIX.length + UNI.length + MAIN.length - 1;
const STRIP_W = (MAX_X + 1) * CELL_W;

/* プレイヤーの進むマス列。就職ルートは合流マス(20)を飛ばして21から合流する */
function routeOf(p){
  const head = PREFIX.concat(p.route === 'uni' ? UNI : (p.route === 'job' ? JOBR : []));
  const main = (p.route === 'job') ? MAIN.slice(1) : MAIN;
  return head.concat(main);
}
function amtHtml(s){
  return s.replace(/[+\-]?¥[0-9,]+/g, mm => '<span class="amt">' + mm + '</span>');
}
function log(s, kind){
  const k = kind || 'neutral';
  if (kind) lastEvent = {kind: k, text: s};
  logLines.unshift('<span class="lg lg-' + k + '">' + amtHtml(s) + '</span>');
  if (logLines.length > 80) logLines.pop();
  const el = $('log');
  if (el) el.innerHTML = logLines.join('<br>');
  const m = $('msg');
  if (m){
    m.innerHTML = amtHtml(s);
    m.className = (k === 'neutral') ? '' : 'ev-' + k;
  }
}
function drawJob(p, high){
  const list = (high || p.degree) ? JOBS_HIGH : JOBS_NORMAL;
  const j = pick(list);
  return {name: j.name, salary: j.salary};
}
/* roll 分進む。必止マスとゴールで止まる。踏んだ経路インデックスを返す */
function applyMove(p, roll){
  const route = routeOf(p);
  const visited = [];
  const steps = Math.min(roll, route.length - 1 - p.pos);
  for (let i = 0; i < steps; i++){
    p.pos++;
    visited.push(p.pos);
    if (MUST_STOP[NODES[route[p.pos]].t]) break;
  }
  return visited;
}
/* 給料の支払い：通過は1倍、ぴったり停止は2倍。支払いのたびにローンを自動返済する */
function repayLoan(p){
  if (!p.loan || p.loan <= 0) return;
  const rep = Math.min(LOAN_REPAY, p.loan);
  p.loan -= rep;
  p.money -= rep;
  log(p.name + '： 🏦 ローン返済 -' + fmt(rep) + '（残高 ' + fmt(p.loan) + '）', 'neutral');
}
function paySalary(p, exact){
  const base = p.job ? p.job.salary : BAITO_PAY;
  const amt = exact ? base * 2 : base;
  p.money += amt;
  if (exact) log(p.name + '： 💴 給料日にぴったり！ ぴったりボーナスで2倍 +' + fmt(amt) + (p.job ? '' : '（アルバイト代）'), 'good');
  else log(p.name + '： 💴 給料日を通過 +' + fmt(amt) + (p.job ? '' : '（アルバイト代）'), 'good');
  sfxPay();
  repayLoan(p);
}
function doMove(p, roll){
  const visited = applyMove(p, roll);
  const route = routeOf(p);
  const nd = NODES[route[p.pos]];
  log(p.name + '： ルーレット ' + roll + ' → ' + nd.icon + ' ' + nd.label);
  visited.forEach(v => {
    if (NODES[route[v]].t === 'payday') paySalary(p, v === p.pos);
  });
  return visited;
}
/* ---- 恋愛（結婚マス）：出会い → デートで好感度 → プロポーズ ---- */
function romanceStop(p){
  const idx = players.indexOf(p);
  const opp = players[1 - idx];
  if (p.partner === 'married'){
    moneyEvent(p, ROMANCE_MARRIED, '💕');
  } else if (p.partner === 'none'){
    p.partner = 'dating';
    p.affection = 30;
    log(p.name + '： 💕 素敵な人と出会った！ 交際スタート（好感度30）', 'good'); sfxGood();
  } else if (p.affection < 50){
    p.affection = Math.min(100, p.affection + 20);
    log(p.name + '： 💕 デートした（好感度 ' + p.affection + '）', 'good'); sfxGood();
  } else {
    const roll = nextRoll();
    if (roll >= 4){
      p.partner = 'married';
      log(p.name + '： 💍 プロポーズ成功！（ダイス ' + roll + '）結婚した！', 'good');
      opp.money -= GIFT;
      p.money += GIFT;
      log(p.name + '： 💒 ' + opp.name + 'からご祝儀 ' + fmt(GIFT) + ' をもらった（' + opp.name + ' ' + fmt(-GIFT) + '）', 'good');
      sfxGoal();
    } else {
      p.affection = Math.max(0, p.affection - 10);
      log(p.name + '： 💔 プロポーズ失敗…（ダイス ' + roll + '）好感度 ' + p.affection + ' に下がった', 'bad'); sfxBad();
    }
  }
  render();
}
/* ---- デートマス ---- */
function dateStop(p){
  if (p.partner === 'married'){
    p.money += 10000;
    log(p.name + '： ❤️ 夫婦で外食券が当たった！ +' + fmt(10000), 'good'); sfxGood();
  } else if (p.partner === 'dating'){
    p.affection = Math.min(100, p.affection + 20);
    log(p.name + '： ❤️ デートした（好感度 ' + p.affection + '）', 'good'); sfxGood();
  } else {
    p.partner = 'dating';
    p.affection = 20;
    log(p.name + '： ❤️ 素敵な出会いがあった！ 交際スタート（好感度20）', 'good'); sfxGood();
  }
  render();
}
/* ---- 勝負マス（対人ダイス対決） ---- */
function duelStop(p){
  const idx = players.indexOf(p);
  const opp = players[1 - idx];
  const r1 = nextRoll(), r2 = nextRoll();
  if (r1 === r2){
    log(p.name + '： ⚔️ ' + opp.name + 'と勝負！ ダイス ' + r1 + ' 対 ' + r2 + ' で引き分け', 'neutral');
  } else if (r1 > r2){
    p.money += DUEL_STAKE;
    opp.money -= DUEL_STAKE;
    log(p.name + '： ⚔️ ' + opp.name + 'と勝負！ ダイス ' + r1 + ' 対 ' + r2 + ' で勝利！ ' + opp.name + 'から ' + fmt(DUEL_STAKE) + ' を奪った', 'good'); sfxGood();
  } else {
    p.money -= DUEL_STAKE;
    opp.money += DUEL_STAKE;
    log(p.name + '： ⚔️ ' + opp.name + 'と勝負！ ダイス ' + r1 + ' 対 ' + r2 + ' で敗北… ' + fmt(DUEL_STAKE) + ' を取られた', 'bad'); sfxBad();
  }
  render();
}
/* ---- 仕事マス（現在の職業に応じたイベント） ---- */
function jobEvent(p){
  if (!p.job){
    p.money += JOBLESS_PAY;
    log(p.name + '： 🧑‍💼 バイトが忙しくてバイト代 +' + fmt(JOBLESS_PAY), 'good'); sfxPay();
    render(); return;
  }
  const list = JOB_EVENTS[p.job.name] || JOB_EVENTS_FALLBACK;
  const e = pick(list);
  if (e.raise){
    p.job.salary += e.raise;
    log(p.name + '： 🧑‍💼 ' + e.text + '！ 給料が ' + fmt(p.job.salary) + ' に上がった', 'good'); sfxGood();
  } else {
    const amt = Math.round(p.job.salary * e.mult / 10000) * 10000;
    p.money += amt;
    log(p.name + '： 🧑‍💼 【' + p.job.name + '】' + e.text + ' ' + (amt >= 0 ? '+' : '') + fmt(amt), amt >= 0 ? 'good' : 'bad');
    if (amt >= 0) sfxGood(); else sfxBad();
  }
  render();
}
/* 金額イベント表から1件引いて適用する（研修・休憩・既婚の恋愛マス用） */
function moneyEvent(p, list, icon){
  const e = pick(list);
  p.money += e.amt;
  const kind = e.amt > 0 ? 'good' : (e.amt < 0 ? 'bad' : 'neutral');
  log(p.name + '： ' + icon + ' ' + e.text + (e.amt > 0 ? ' +' : ' ') + fmt(e.amt), kind);
  if (e.amt > 0) sfxGood(); else if (e.amt < 0) sfxBad();
  render();
}
/* ---- 大学ルートのイベントマス：人脈が増減する ---- */
function uniStop(p){
  const id = routeOf(p)[p.pos];
  const list = UNI_EVENTS[id] || [{text: '大学生活を楽しんだ', jin: 1}];
  const e = pick(list);
  p.jinmyaku = Math.max(0, Math.min(JINMYAKU_MAX, p.jinmyaku + e.jin));
  const kind = e.jin > 0 ? 'good' : (e.jin < 0 ? 'bad' : 'neutral');
  log(p.name + '： ' + NODES[id].icon + ' ' + e.text + ' 人脈' + (e.jin >= 0 ? '+' : '') + e.jin + '（人脈が ' + p.jinmyaku + ' になった）', kind);
  if (e.jin > 0) sfxGood(); else if (e.jin < 0) sfxBad();
  render();
}
function resolveLanding(p){
  const idx = players.indexOf(p);
  const isCpu = idx === 1;
  const nd = NODES[routeOf(p)[p.pos]];
  switch (nd.t){
    case 'start':
      log(p.name + '： スタート地点', 'neutral'); break;
    case 'plain':
      log(p.name + '： ' + (nd.text || '何も起きなかった'), 'neutral'); break;
    case 'uni':
      uniStop(p); break;
    case 'training':
      moneyEvent(p, TRAINING_EVENTS, '🏢'); break;
    case 'rest':
      moneyEvent(p, REST_EVENTS, '🍵'); break;
    case 'bonus':
      p.money += nd.amt;
      log(p.name + '： ' + nd.text + ' +' + fmt(nd.amt), 'good'); sfxGood(); break;
    case 'payday':
      break; /* 支払いは doMove で通過／ぴったり時に処理済み */
    case 'lucky': {
      const e = pick(LUCKY);
      p.money += e.amt;
      log(p.name + '： 🍀 ' + e.text + ' +' + fmt(e.amt), 'good'); sfxGood(); break;
    }
    case 'unlucky': {
      const e = pick(UNLUCKY);
      p.money += e.amt;
      log(p.name + '： 💸 ' + e.text + ' ' + fmt(e.amt), 'bad'); sfxBad(); break;
    }
    case 'child': {
      if (p.partner !== 'married'){
        const e = pick(CHILD_SINGLE);
        p.money += e.amt;
        const kind = e.amt > 0 ? 'good' : (e.amt < 0 ? 'bad' : 'neutral');
        log(p.name + '： 👶 ' + e.text + (e.amt > 0 ? ' +' + fmt(e.amt) : (e.amt < 0 ? ' ' + fmt(e.amt) : '')), kind);
        if (e.amt > 0) sfxGood(); else if (e.amt < 0) sfxBad();
      } else {
        const opp = players[1 - idx];
        p.children++;
        log(p.name + '： 👶 子供が生まれた！（' + p.children + '人目）', 'good');
        opp.money -= CHILD_BONUS;
        p.money += CHILD_BONUS;
        log(p.name + '： 🎁 ' + opp.name + 'から出産祝い ' + fmt(CHILD_BONUS) + ' をもらった（' + opp.name + ' ' + fmt(-CHILD_BONUS) + '）', 'good');
        sfxGood();
      }
      break;
    }
    case 'study': {
      p.studyCount++;
      const line = Math.min(5, 2 + p.studyCount);
      log(p.name + '： 📚 しっかり勉強した！（勉強 ' + p.studyCount + '回目、受験の合格ラインは ' + line + '）', 'good'); sfxGood();
      break;
    }
    case 'change':
      p.job = drawJob(p, false);
      log(p.name + '： 🔄 転職した！ 新しい職業は「' + p.job.name + '」（給料 ' + fmt(p.job.salary) + '）', 'neutral'); sfxGood(); break;
    case 'employ':
      p.job = drawJob(p, false);
      log(p.name + '： 💼 就職した！ 職業は「' + p.job.name + '」（給料 ' + fmt(p.job.salary) + '）', 'good'); sfxGood(); break;
    case 'job':
      jobEvent(p); break;
    case 'date':
      dateStop(p); break;
    case 'duel':
      duelStop(p); break;
    case 'jobu':
      p.degree = true;
      if (p.jinmyaku >= JINMYAKU_GATE){
        p.job = drawJob(p, true);
        log(p.name + '： 🎓 大学を卒業して就職！ 人脈（' + p.jinmyaku + '）を活かして高給の職業に！ 職業は「' + p.job.name + '」（給料 ' + fmt(p.job.salary) + '）', 'good');
      } else {
        const j = pick(JOBS_NORMAL);
        p.job = {name: j.name, salary: j.salary};
        log(p.name + '： 🎓 大学を卒業したが、人脈が ' + p.jinmyaku + '（必要 ' + JINMYAKU_GATE + '）で高給の就職はならなかった… 職業は「' + p.job.name + '」（給料 ' + fmt(p.job.salary) + '）', 'bad');
      }
      sfxGood(); break;
    case 'exam':
      examStop(p); break;
    case 'marriage':
      romanceStop(p); break;
    case 'house':
      if (p.house){
        p.money -= HOUSE_TAX;
        log(p.name + '： 🏠 ' + p.house.name + 'の固定資産税 ' + fmt(-HOUSE_TAX), 'bad'); sfxBad();
      }
      else if (isCpu) cpuHouse(p);
      else { pending = {type: 'house'}; log(p.name + '： 🏠 家を買うチャンス！ どうする？', 'neutral'); }
      break;
    case 'gamble':
      if (isCpu) doGamble(p, cpuBet(p));
      else { pending = {type: 'gamble'}; log(p.name + '： 🎰 ギャンブル勝負！ いくらかける？', 'neutral'); }
      break;
    case 'goal':
      p.goaled = true;
      log(p.name + '： 🏆 ゴール！！', 'good'); sfxGoal(); break;
  }
  render();
}
/* ---- 受験マス：止まったら自動で合否判定（合格ライン = min(5, 2 + 勉強回数)） ---- */
function examStop(p){
  const line = Math.min(5, 2 + p.studyCount);
  const roll = nextRoll();
  if (roll <= line){
    p.route = 'uni';
    p.degree = true;
    p.money -= TUITION;
    log(p.name + '： 🎓 受験… ダイス ' + roll + '（合格ライン ' + line + '）で合格！ 大学へ進学（授業料 ' + fmt(TUITION) + '）', 'good'); sfxGood();
  } else {
    p.route = 'job';
    log(p.name + '： 🎓 受験… ダイス ' + roll + '（合格ライン ' + line + '）で不合格… 浪人せず就職することにした', 'bad'); sfxBad();
  }
  render();
}
/* ---- house ---- */
function houseTotal(h){ return Math.round(h.price * LOAN_RATE / 10000) * 10000; }
function houseDown(h){ return houseTotal(h) / 2; }
function applyHouse(p, tierIdx, method){
  if (tierIdx < 0){ log(p.name + '： 🏠 家は買わなかった', 'neutral'); render(); return; }
  const h = HOUSES[tierIdx];
  p.house = {name: h.name, price: h.price};
  if (method === 'loan'){
    const total = houseTotal(h), down = total / 2;
    p.money -= down;
    p.loan = total - down;
    log(p.name + '： 🏠 ' + h.name + 'を割賦で買った！ 頭金 ' + fmt(down) + '（総額 ' + fmt(total) + '、ローン残高 ' + fmt(p.loan) + '）', 'good'); sfxPay();
  } else {
    p.money -= h.price;
    log(p.name + '： 🏠 ' + h.name + 'を買った！ ' + fmt(h.price), 'good'); sfxPay();
  }
  render();
}
function cpuHouse(p){
  if (rf() < 0.5){
    for (let i = HOUSES.length - 1; i >= 0; i--){
      if (p.money >= HOUSES[i].price){ applyHouse(p, i, 'full'); return; }
    }
    for (let i = HOUSES.length - 1; i >= 0; i--){
      if (p.money >= houseDown(HOUSES[i])){ applyHouse(p, i, 'loan'); return; }
    }
  }
  log(p.name + '： 🏠 家は買わなかった', 'neutral');
  render();
}
function chooseHouse(tierIdx, method){
  if (!pending || pending.type !== 'house') return;
  const p = players[turn];
  pending = null;
  if (tierIdx >= 0){
    const h = HOUSES[tierIdx];
    if (method === 'loan'){ if (p.money < houseDown(h)) tierIdx = -1; }
    else if (p.money < h.price) tierIdx = -1;
  }
  applyHouse(p, tierIdx, method === 'loan' ? 'loan' : 'full');
  enterWait();
}
/* ---- gamble ---- */
function doGamble(p, bet){
  if (!bet){ log(p.name + '： 🎰 ギャンブルはパスした', 'neutral'); render(); return; }
  if (rf() < 0.5){
    p.money += bet;
    log(p.name + '： 🎰 ' + fmt(bet) + ' かけて勝った！ +' + fmt(bet), 'good'); sfxGood();
  } else {
    p.money -= bet;
    log(p.name + '： 🎰 ' + fmt(bet) + ' かけて負けた… ' + fmt(-bet), 'bad'); sfxBad();
  }
  render();
}
function cpuBet(p){
  const opts = [0, 50000, 100000].filter(b => b <= p.money);
  return opts.length ? pick(opts) : 0;
}
function chooseGamble(bet){
  if (!pending || pending.type !== 'gamble') return;
  const p = players[turn];
  pending = null;
  if ([0, 50000, 100000].indexOf(bet) < 0) bet = 0;
  doGamble(p, bet);
  enterWait();
}
/* ---- settlement ---- */
function settle(){
  return players.map(p => {
    const hv = p.house ? p.house.price : 0;
    const cv = p.children * CHILD_VALUE;
    const loan = p.loan || 0;
    return {money: p.money, houseValue: hv, childValue: cv, loan: loan, assets: p.money + hv + cv - loan};
  });
}
function computeWinner(){
  const s = settle();
  if (s[0].assets === s[1].assets) return -1;
  return s[0].assets > s[1].assets ? 0 : 1;
}
function endGame(){
  over = true;
  phase = 'over';
  winner = computeWinner();
  const s = settle();
  let html = '';
  players.forEach((p, i) => {
    html += '<p>' + (i === 0 ? '🟡 あなた' : '🔵 CPU') + '<br>所持金 ' + fmt(s[i].money) +
            '<br>＋ 家の価値 ' + fmt(s[i].houseValue) +
            '<br>＋ 子供 ' + p.children + '人 ' + fmt(s[i].childValue) +
            (s[i].loan > 0 ? '<br>− ローン残高 ' + fmt(s[i].loan) : '') +
            '<br>＝ 資産 <b>' + fmt(s[i].assets) + '</b></p>';
  });
  $('r-detail').innerHTML = html;
  $('r-title').textContent = winner === -1 ? '🤝 引き分け！' : (winner === 0 ? '🎉 あなたの勝ち！' : '🏆 CPUの勝ち！');
  $('result').classList.remove('hidden');
  log(winner === -1 ? '結果： 引き分け！' : '結果： ' + players[winner].name + ' の勝ち！', winner === 0 ? 'good' : (winner === 1 ? 'bad' : 'neutral'));
  sfxGoal();
  render();
}
function finishTurn(){
  if (players.every(p => p.goaled)){ endGame(); return; }
  if (!players[1 - turn].goaled) turn = 1 - turn;
  phase = (turn === 1) ? 'cpu' : 'roll';
  render();
  scheduleCpu();
}
function afterResolve(){
  if (pending){ phase = 'choice'; render(); return; }
  enterWait();
}
/* イベント結果を読めるよう、次のターンまで少し止まる */
function enterWait(){
  phase = 'wait';
  render();
  if (waitTimer) clearTimeout(waitTimer);
  waitTimer = setTimeout(() => { waitTimer = null; finishTurn(); }, WAIT_MS);
}
function flushWait(){
  if (waitTimer){ clearTimeout(waitTimer); waitTimer = null; finishTurn(); }
}
function nextRoll(){
  if (forcedRoll != null){ const v = forcedRoll; forcedRoll = null; return v; }
  return 1 + Math.floor(rf() * 6);
}
/* 同期的に1ターン進める（テスト用。CPUの選択は自動） */
function takeTurn(roll){
  if (over) return;
  const p = players[turn];
  if (p.goaled){ finishTurn(); return; }
  const r = (roll == null) ? nextRoll() : roll;
  phase = 'busy';
  doMove(p, r);
  resolveLanding(p);
  afterResolve();
}

/* ================= UI ================= */
/* カメラ：手番プレイヤーの表示中マスがビューポート中央に来るようストリップを横移動 */
function focusNodeId(){
  const p = players[turn];
  const pos = dispPos[turn] != null ? dispPos[turn] : p.pos;
  return routeOf(p)[pos];
}
function applyCamera(){
  const vp = $('board'), st = $('strip');
  if (!vp || !st) return;
  const vw = vp.clientWidth || 0;
  if (vw > 0){
    if (STRIP_W <= vw){
      camX = (vw - STRIP_W) / 2;
    } else {
      const cd = COORDS[focusNodeId()];
      const tx = vw / 2 - (cd.x * CELL_W + CELL_W / 2);
      camX = Math.max(vw - STRIP_W, Math.min(0, tx));
    }
  }
  st.style.transform = 'translateX(' + camX + 'px)';
}
function render(){
  for (let i = 0; i < 2; i++){
    const p = players[i], pre = 'p' + i;
    $(pre + '-job').textContent = p.job ? p.job.name : 'まだなし';
    $(pre + '-sal').textContent = p.job ? fmt(p.job.salary) : '-';
    $(pre + '-study').textContent = ' 📚×' + p.studyCount + (p.route === 'uni' ? ' 🎓合格 🤝人脈' + p.jinmyaku : (p.route === 'job' ? ' 就職' : ''));
    const mEl = $(pre + '-money');
    mEl.textContent = fmt(p.money);
    mEl.classList.toggle('neg', p.money < 0);
    let fam;
    if (p.partner === 'married') fam = '💍結婚';
    else if (p.partner === 'dating') fam = '💑好感度' + p.affection;
    else fam = '独身';
    $(pre + '-fam').textContent = fam + ' / 子供 ' + p.children + '人';
    $(pre + '-house').textContent = p.house ? p.house.name + (p.loan > 0 ? '（ローン ' + fmt(p.loan) + '）' : '') : 'なし';
    $(pre + '-card').classList.toggle('active', turn === i && !over);
    $(pre + '-card').classList.toggle('goaled', p.goaled);
  }
  const strip = $('strip');
  strip.innerHTML = '';
  strip.style.width = STRIP_W + 'px';
  for (let lane = 0; lane < 2; lane++){
    const tr = document.createElement('div');
    tr.className = 'track';
    tr.style.top = (lane * LANE_H + LANE_H / 2) + 'px';
    strip.appendChild(tr);
  }
  const curNode = over ? -1 : routeOf(players[turn])[players[turn].pos];
  for (const key in NODES){
    const id = +key, nd = NODES[key], cd = COORDS[id];
    const cell = document.createElement('div');
    cell.className = 'cell t-' + nd.t + (UNI.indexOf(id) >= 0 ? ' uni' : '') + (JOBR.indexOf(id) >= 0 ? ' jobr' : '');
    cell.dataset.node = String(id);
    cell.style.left = (cd.x * CELL_W + 2) + 'px';
    cell.style.top = (cd.lane * LANE_H + 2) + 'px';
    if (id === curNode) cell.classList.add('active');
    cell.innerHTML = '<div class="ic">' + nd.icon + '</div><div class="lb">' + nd.label + '</div>';
    const tk = document.createElement('div');
    tk.className = 'toks';
    for (let i = 0; i < 2; i++){
      const r = routeOf(players[i]);
      const pos = dispPos[i] != null ? dispPos[i] : players[i].pos;
      if (r[pos] === id){
        const img = document.createElement('img');
        img.src = IMGS[i];
        img.className = 'tok tok' + i;
        img.alt = '';
        tk.appendChild(img);
      }
    }
    cell.appendChild(tk);
    strip.appendChild(cell);
  }
  applyCamera();
  $('roll').disabled = !(phase === 'roll' && turn === 0 && !over);
  renderChoice();
}
function mkBtn(label, fn, cls){
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  if (cls) b.className = cls;
  b.addEventListener('click', fn);
  return b;
}
function renderChoice(){
  const box = $('choice');
  box.innerHTML = '';
  if (!pending || turn !== 0){ box.style.display = 'none'; return; }
  box.style.display = 'flex';
  const p = players[0];
  if (pending.type === 'house'){
    HOUSES.forEach((h, i) => {
      const b1 = mkBtn('🏠 ' + h.name + ' 一括 ' + fmt(h.price), () => chooseHouse(i, 'full'));
      if (p.money < h.price) b1.disabled = true;
      box.appendChild(b1);
      const b2 = mkBtn('🏠 ' + h.name + ' 割賦 頭金' + fmt(houseDown(h)) + '（総額' + fmt(houseTotal(h)) + '）', () => chooseHouse(i, 'loan'), 'sub');
      if (p.money < houseDown(h)) b2.disabled = true;
      box.appendChild(b2);
    });
    box.appendChild(mkBtn('買わない', () => chooseHouse(-1), 'sub'));
  } else if (pending.type === 'gamble'){
    [0, 50000, 100000].forEach(v => {
      box.appendChild(mkBtn(v === 0 ? 'パスする' : fmt(v) + ' かける', () => chooseGamble(v), v === 0 ? 'sub' : ''));
    });
  }
}
/* ---- animations ---- */
function spinAnim(finalRoll, cb){
  const disp = $('rnum');
  let n = 0;
  const total = 10;
  (function tick(){
    n++;
    if (n < total){
      disp.textContent = String(1 + Math.floor(Math.random() * 6));
      sfxTick();
      setTimeout(tick, 50 + n * 10);
    } else {
      disp.textContent = String(finalRoll);
      sfxTick();
      cb();
    }
  })();
}
function stepAnim(p, visited, cb){
  const idx = players.indexOf(p);
  let i = 0;
  (function next(){
    if (i >= visited.length){
      dispPos[idx] = null;
      render();
      cb();
      return;
    }
    dispPos[idx] = visited[i];
    i++;
    sfxStep();
    render();
    setTimeout(next, STEP_MS);
  })();
}
function uiPlayTurn(){
  const p = players[turn];
  phase = 'busy';
  render();
  const roll = nextRoll();
  spinAnim(roll, () => {
    const visited = doMove(p, roll);
    stepAnim(p, visited, () => {
      resolveLanding(p);
      afterResolve();
    });
  });
}
function uiRoll(){
  if (over || turn !== 0 || phase !== 'roll') return;
  if (players[0].goaled){ finishTurn(); return; }
  uiPlayTurn();
}
function uiCpuTurn(){
  if (over || turn !== 1) return;
  if (players[1].goaled){ finishTurn(); return; }
  uiPlayTurn();
}
function scheduleCpu(){
  if (!autoCpu || over) return;
  if (turn === 1) setTimeout(uiCpuTurn, 1000);
}
window.addEventListener('resize', applyCamera);
$('roll').addEventListener('click', uiRoll);
$('snd').addEventListener('click', toggleSound);
$('again').addEventListener('click', newGame);
$('p0-img').src = IMGS[0];
$('p1-img').src = IMGS[1];
updateSndBtn();

/* ================= test hooks ================= */
function state(){
  return {
    players: players.map(p => ({
      name: p.name, money: p.money,
      job: p.job ? {name: p.job.name, salary: p.job.salary} : null,
      married: p.partner === 'married', partner: p.partner, affection: p.affection, loan: p.loan, children: p.children,
      house: p.house ? {name: p.house.name, price: p.house.price} : null,
      route: p.route, degree: p.degree, studyCount: p.studyCount, jinmyaku: p.jinmyaku, pos: p.pos,
      node: routeOf(p)[p.pos], goaled: p.goaled
    })),
    turn: turn, phase: phase,
    pending: pending ? {type: pending.type} : null,
    over: over, winner: winner,
    lastEvent: lastEvent ? {kind: lastEvent.kind, text: lastEvent.text} : null
  };
}
function setPlayer(i, props){
  if (!players[i]) return;
  props = Object.assign({}, props);
  if ('married' in props){ props.partner = props.married ? 'married' : 'none'; delete props.married; }
  Object.assign(players[i], props);
  render();
}
window.JINSEI = {
  state: state,
  newGame: newGame,
  takeTurn: takeTurn,
  flushWait: flushWait,
  nextRoll: nextRoll,
  timing: {waitMs: WAIT_MS, stepMs: STEP_MS},
  forceRoll: v => { forcedRoll = v; },
  setRng: fn => { rng = fn || Math.random; },
  setAutoCpu: b => { autoCpu = !!b; },
  chooseHouse: chooseHouse,
  chooseGamble: chooseGamble,
  settle: settle,
  routeOf: i => routeOf(players[i]).slice(),
  setPlayer: setPlayer,
  nodeCoord: i => { const c = COORDS[i]; return c ? {x: c.x, lane: c.lane} : null; },
  cameraX: () => camX,
  layout: {cellW: CELL_W, laneH: LANE_H, stripW: STRIP_W, maxX: MAX_X},
  soundMuted: soundMuted,
  toggleSound: toggleSound,
  data: {JOBS_NORMAL: JOBS_NORMAL, JOBS_HIGH: JOBS_HIGH, HOUSES: HOUSES, LUCKY: LUCKY, UNLUCKY: UNLUCKY, CHILD_SINGLE: CHILD_SINGLE, UNI_EVENTS: UNI_EVENTS, TRAINING_EVENTS: TRAINING_EVENTS, REST_EVENTS: REST_EVENTS, ROMANCE_MARRIED: ROMANCE_MARRIED, JINMYAKU_GATE: JINMYAKU_GATE, PREFIX: PREFIX, UNI: UNI, JOBR: JOBR, MAIN: MAIN, NODES: NODES, JOB_EVENTS: JOB_EVENTS}
};
newGame();
</script>

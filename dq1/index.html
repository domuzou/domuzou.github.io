<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ななクエ ～ワッカ那月の冒険～</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background:#0b1026;color:#fff;display:flex;flex-direction:column;align-items:center;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  header{width:100%;max-width:520px;padding:5px 12px 0;display:flex;align-items:center;justify-content:space-between}
  h1{font-size:19px}
  h1 .sub{font-size:10px;opacity:.75;font-weight:normal;margin-left:4px}
  .brand-logo{height:26px;width:auto;vertical-align:middle;pointer-events:none;margin-left:6px}
  .hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
  #stage{position:relative;width:min(96vw,480px);margin-top:4px}
  canvas{width:100%;display:block;border:2px solid #3b4a7a;border-radius:8px;background:#000;image-rendering:pixelated}
  #statuswin{position:absolute;top:8px;left:8px;background:rgba(8,8,24,.88);border:2px solid #fff;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.55;min-width:118px;pointer-events:none;z-index:7}
  #statuswin.mini{font-size:11px;line-height:1.45;padding:4px 7px;min-width:0;opacity:.92}
  #statuswin.mini .nm,#statuswin.mini #st-g{display:none}
  #statuswin .nm{font-weight:bold;font-size:14px}
  #msgwin{width:min(96vw,480px);margin-top:6px;background:rgba(8,8,24,.92);border:2px solid #fff;border-radius:8px;padding:9px 12px;font-size:14.5px;line-height:1.65;min-height:86px;white-space:pre-wrap;cursor:pointer}
  #msgwin .arrow{float:right;animation:bl 1s infinite}
  @keyframes bl{50%{opacity:0}}
  #menu{position:absolute;top:8px;right:8px;background:rgba(8,8,24,.94);border:2px solid #fff;border-radius:8px;padding:8px 6px;min-width:150px;display:none;z-index:9}
  #menu .ttl{font-size:11px;opacity:.75;padding:0 8px 4px}
  .mitem{padding:6px 10px;font-size:14.5px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .mitem.sel,.mitem:active{background:#3450a0}
  .mitem small{opacity:.75;font-size:11.5px}
  #battle{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:26px;background:linear-gradient(180deg,#1a2a6b,#0b1026 70%);border-radius:8px;z-index:5}
  #mon-emoji{font-size:92px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
  #mon-name{font-size:17px;margin-top:4px;font-weight:bold}
  #mon-hp{font-size:12px;opacity:.85;margin-top:2px}
  .shake{animation:shk .3s}
  @keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #pad{width:min(96vw,480px);margin-top:6px;display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px}
  #dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:2px}
  .dbtn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;font-size:17px;cursor:pointer}
  .dbtn:active{background:rgba(255,255,255,.35)}
  .dbtn.blank{visibility:hidden}
  #abtns{display:flex;gap:10px;align-items:center}
  .abtn{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.5);font-size:15px;font-weight:bold;color:#fff;cursor:pointer}
  #btn-a{background:#b45309}
  #btn-b{background:#374151}
  .abtn:active{transform:scale(.93)}
  .overlay{position:absolute;inset:0;background:rgba(5,5,18,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;border-radius:8px;text-align:center;padding:18px;z-index:8}
  .overlay h2{font-size:25px;letter-spacing:.06em}
  .overlay p{font-size:13px;line-height:1.8;opacity:.92}
  .bigbtn{background:#f59e0b;border:none;color:#231303;font-weight:bold;font-size:16px;border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:0 3px 0 #b45309}
  .bigbtn.alt{background:#38bdf8;box-shadow:0 3px 0 #0369a1}
  .bigbtn:active{transform:translateY(2px);box-shadow:none}
  .hidden{display:none !important}
  #redflash{position:absolute;inset:0;background:#c00;display:none;z-index:9;border-radius:8px;padding:20px;text-align:center;font-size:15px;line-height:2}
</style>
</head>

function blocked(x,y){var t=tileAt(x,y);if(G.map==="world"){return t==="~"||t==="m";}
 if(t==="#"||t==="T"||t==="W"||t==="t")return true;
 if(t==="D"){var k=G.map+":"+x+","+y;return !G.hero.doors[k];}
 if(npcAt(x,y)||chestAt(x,y))return true;
 return false;}

 if(G.map!=="world"){
   var t=tileAt(nx,ny);

 }
 /* world */

 afterStep();
}

function afterStep(){G.steps++;var h=G.hero;
 if(G.map==="world"){var t=WORLD_ROWS[G.wy][G.wx];
   if(t==="s"&&h.armor!==7){hurtHero(1,true);}
   if(h.armor===6&&G.steps%4===0)h.hp=Math.min(heroStats().hpmax,h.hp+1);
   if(h.armor===7)h.hp=Math.min(heroStats().hpmax,h.hp+1);
 }else{
   var tt=tileAt(G.x,G.y);
   if(tt==="!"&&h.armor!==7){say(["バリヤーに さわった！"],null);hurtHero(15,true);}
   if(h.armor===6&&G.steps%4===0)h.hp=Math.min(heroStats().hpmax,h.hp+1);
   if(h.armor===7)h.hp=Math.min(heroStats().hpmax,h.hp+1);
   var st=(MAPS[G.map].steps||{})[G.x+","+G.y];
   if(st){if(st.map==="world"){G.map="world";G.wx=st.wx;G.wy=st.wy;G.x=st.wx;G.y=st.wy;G.grace=6;saveGame();render();updateStatus();return;}if(st.msg){var m=st.msg;gotoMap(st.map,st.x,st.y);say([m],null);return;}gotoMap(st.map,st.x,st.y);return;}
   var ev=(MAPS[G.map].eventTile||{})[G.x+","+G.y];
   if(ev){mapEvent(ev);return;}
 }
 if(G.light>0)G.light--;
 if(G.repel>0)G.repel--;
 if(G.grace&&G.grace>0)G.grace--;
 updateStatus();render();
 maybeEncounter();
}

function maybeEncounter(){if(!G||B||G.hero.flags.peace)return;if(G.grace&&G.grace>0)return;var inDun=G.map!=="world";var zoneKey=null;

function zoneOf(x,y){var dx=x-29,dy=y-24,d2=dx*dx+dy*dy;if(d2<196)return 0;if(d2<441)return 1;if(x>=46&&y>=43)return 7;if(x>=29&&x<=44&&y>=42)return 5;if(y>=38&&x<27)return 6;if(x>=52)return y<20?3:4;if(x>=44)return 3;if(y>=27)return 3;if(x<20&&y<18)return 2;return 2;}
